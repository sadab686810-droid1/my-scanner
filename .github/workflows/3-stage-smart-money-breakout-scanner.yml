name: PAUL STYLE 5 STOCK ORDER BOOK SELL

on:
  schedule:
    # 09:15 IST = 03:45 UTC
    - cron: '45 3 * * 1-5'

  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    timeout-minutes: 120

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      # ============================================================
      # INSTALL PACKAGES
      # ============================================================
      - name: Install Packages
        run: |
          python -m pip install --upgrade pip

          pip install smartapi-python
          pip install websocket-client
          pip install pyotp
          pip install requests
          pip install logzero


      # ============================================================
      # CREATE SCANNER
      # ============================================================
      - name: Create Scanner
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP: ${{ secrets.ANGEL_TOTP }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN}}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID}}
        run: |

          cat > scanner.py <<'PYTHON'

          import os
          import csv
          import time
          import threading
          import requests
          import pyotp

          from datetime import datetime, time as dt_time, timezone
          from zoneinfo import ZoneInfo

          from SmartApi import SmartConnect
          from SmartApi.smartWebSocketV2 import SmartWebSocketV2


          # ============================================================
          # INDIA TIMEZONE
          # ============================================================

          IST = ZoneInfo("Asia/Kolkata")


          def now_ist():
              return datetime.now(IST)


          def market_time():
              return now_ist().time()


          # ============================================================
          # ANGEL ONE CREDENTIALS
          # ============================================================

          API_KEY = os.getenv("ANGEL_API_KEY")
          CLIENT_ID = os.getenv("ANGEL_CLIENT_ID")
          PASSWORD = os.getenv("ANGEL_PASSWORD")
          TOTP_SECRET = os.getenv("ANGEL_TOTP")


          # ============================================================
          # TELEGRAM
          # ============================================================

          TELEGRAM_BOT_TOKEN = os.getenv("TELEGRAM_BOT_TOKEN")
          TELEGRAM_CHAT_ID = os.getenv("TELEGRAM_CHAT_ID")


          # ============================================================
          # STOCKS
          # ============================================================

          STOCKS = {

              "2885": "RELIANCE",
              "1333": "HDFCBANK",
              "1594": "INFY",
              "3045": "SBIN",
              "3456": "ICICIBANK",

          }


          # ============================================================
          # MARKET TIME
          # ============================================================

          START_TIME = dt_time(9, 15, 0)
          END_TIME   = dt_time(11, 0, 0)


          # ============================================================
          # PAUL STYLE ASK WALL
          # ============================================================

          ASK_TARGET = 3000
          ASK_TOLERANCE = 150

          ASK_MIN = ASK_TARGET - ASK_TOLERANCE
          ASK_MAX = ASK_TARGET + ASK_TOLERANCE


          # ============================================================
          # REPLENISHMENT
          # ============================================================

          REPLENISH_DROP = 300
          REPLENISH_MIN = 2700


          # ============================================================
          # WEAK BID
          # ============================================================

          WEAK_BID_RATIO = 0.40


          # ============================================================
          # PRICE CONDITION
          # ============================================================

          PRICE_NEAR_PERCENT = 0.002


          # ============================================================
          # OBSERVATION SETTINGS
          # ============================================================

          MIN_OBSERVATIONS = 3
          OBSERVATION_INTERVAL = 1.0


          # ============================================================
          # SIGNAL COOLDOWN
          # ============================================================

          SIGNAL_COOLDOWN = 300


          # ============================================================
          # GLOBAL DATA
          # ============================================================

          data = {}

          last_signal_time = {}

          previous_ltp = {}


          # ============================================================
          # WEBSOCKET OBJECT
          # ============================================================

          sws = None


          # ============================================================
          # TELEGRAM FUNCTION
          # ============================================================

          def send_telegram(message):

              if not TELEGRAM_BOT_TOKEN:
                  print("⚠️ TELEGRAM_BOT_TOKEN missing")
                  return

              if not TELEGRAM_CHAT_ID:
                  print("⚠️ TELEGRAM_CHAT_ID missing")
                  return

              url = (
                  f"https://api.telegram.org/bot"
                  f"{TELEGRAM_BOT_TOKEN}/sendMessage"
              )

              payload = {
                  "chat_id": TELEGRAM_CHAT_ID,
                  "text": message
              }

              try:

                  response = requests.post(
                      url,
                      data=payload,
                      timeout=10
                  )

                  if response.ok:
                      print("📲 Telegram sent")

                  else:
                      print(
                          "❌ Telegram error:",
                          response.status_code,
                          response.text
                      )

              except Exception as e:

                  print(
                      "❌ Telegram exception:",
                      e
                  )


          # ============================================================
          # CSV FILE
          # ============================================================

          CSV_FILE = "paul_sell_signals.csv"


          def save_signal(stock, info):

              file_exists = os.path.exists(CSV_FILE)

              with open(
                  CSV_FILE,
                  "a",
                  newline="",
                  encoding="utf-8"
              ) as f:

                  writer = csv.writer(f)

                  if not file_exists:

                      writer.writerow([
                          "TIME",
                          "STOCK",
                          "LTP",
                          "BID_QTY",
                          "ASK_QTY",
                          "BID_PRICE",
                          "ASK_PRICE",
                          "REASON"
                      ])


                  writer.writerow([

                      now_ist().strftime(
                          "%Y-%m-%d %H:%M:%S"
                      ),

                      stock,

                      info.get("ltp"),

                      info.get("bid_qty"),

                      info.get("ask_qty"),

                      info.get("bid_price"),

                      info.get("ask_price"),

                      "PAUL STYLE ORDER BOOK SELL"

                  ])


          # ============================================================
          # PROCESS SNAP QUOTE
          # ============================================================

          def process_quote(token, quote):

              try:

                  stock = STOCKS.get(str(token))

                  if not stock:
                      return


                  # ----------------------------------------------------
                  # LTP
                  # ----------------------------------------------------

                  ltp = quote.get("last_traded_price", 0)

                  # Angel often sends price in paise
                  ltp = float(ltp) / 100


                  # ----------------------------------------------------
                  # BEST 5 BUY / SELL
                  # ----------------------------------------------------

                  depth = quote.get(
                      "depth",
                      {}
                  )


                  buy_data = depth.get(
                      "buy",
                      []
                  )

                  sell_data = depth.get(
                      "sell",
                      []
                  )


                  if not buy_data or not sell_data:
                      return


                  best_bid = buy_data[0]
                  best_ask = sell_data[0]


                  bid_qty = float(
                      best_bid.get(
                          "quantity",
                          0
                      )
                  )

                  ask_qty = float(
                      best_ask.get(
                          "quantity",
                          0
                      )
                  )


                  bid_price = float(
                      best_bid.get(
                          "price",
                          0
                      )
                  ) / 100


                  ask_price = float(
                      best_ask.get(
                          "price",
                          0
                      )
                  ) / 100


                  # ----------------------------------------------------
                  # FIRST OBSERVATION
                  # ----------------------------------------------------

                  if stock not in data:

                      data[stock] = {
                          "observations": [],
                          "last_observation": 0
                      }


                  state = data[stock]

                  current_time = time.time()


                  # ----------------------------------------------------
                  # 1 SECOND OBSERVATION
                  # ----------------------------------------------------

                  if (
                      current_time
                      - state["last_observation"]
                      < OBSERVATION_INTERVAL
                  ):
                      return


                  state["last_observation"] = current_time


                  # ----------------------------------------------------
                  # ASK WALL
                  # ----------------------------------------------------

                  ask_wall = (
                      ASK_MIN
                      <= ask_qty
                      <= ASK_MAX
                  )


                  # ----------------------------------------------------
                  # WEAK BID
                  # ----------------------------------------------------

                  weak_bid = False

                  if ask_qty > 0:

                      weak_bid = (
                          bid_qty / ask_qty
                          <= WEAK_BID_RATIO
                      )


                  # ----------------------------------------------------
                  # PRICE NEAR ASK
                  # ----------------------------------------------------

                  price_near_ask = False

                  if ask_price > 0:

                      distance = (
                          ask_price - ltp
                      ) / ask_price

                      price_near_ask = (
                          0
                          <= distance
                          <= PRICE_NEAR_PERCENT
                      )


                  # ----------------------------------------------------
                  # PRICE FAILED
                  # ----------------------------------------------------

                  price_failed = False

                  if ask_price > 0:

                      price_failed = (
                          ltp <= ask_price
                      )


                  # ----------------------------------------------------
                  # ASK REPLENISHMENT
                  # ----------------------------------------------------

                  replenishment = False

                  observations = state[
                      "observations"
                  ]

                  if observations:

                      previous_ask = observations[-1][
                          "ask_qty"
                      ]

                      replenishment = (

                          previous_ask
                          - ask_qty
                          >= REPLENISH_DROP

                          and

                          ask_qty
                          >= REPLENISH_MIN
                      )


                  # ----------------------------------------------------
                  # SAVE OBSERVATION
                  # ----------------------------------------------------

                  observation = {

                      "time": now_ist(),

                      "ltp": ltp,

                      "bid_qty": bid_qty,

                      "ask_qty": ask_qty,

                      "bid_price": bid_price,

                      "ask_price": ask_price,

                      "ask_wall": ask_wall,

                      "weak_bid": weak_bid,

                      "price_near_ask": price_near_ask,

                      "price_failed": price_failed,

                      "replenishment": replenishment

                  }


                  observations.append(
                      observation
                  )


                  # Keep only latest observations
                  if len(observations) > 10:

                      observations.pop(0)


                  print(
                      f"{stock:<12} "
                      f"LTP={ltp:.2f} "
                      f"BID={bid_qty:.0f} "
                      f"ASK={ask_qty:.0f} "
                      f"ASK_WALL={ask_wall} "
                      f"WEAK_BID={weak_bid} "
                      f"FAIL={price_failed} "
                      f"REPLENISH={replenishment}"
                  )


                  # ----------------------------------------------------
                  # WATCH STAGE
                  # ----------------------------------------------------

                  if len(observations) < MIN_OBSERVATIONS:

                      return


                  # ----------------------------------------------------
                  # CONFIRM STAGE
                  # ----------------------------------------------------

                  last_two = observations[-2:]


                  ask_wall_count = sum(
                      1
                      for x in last_two
                      if x["ask_wall"]
                  )


                  weak_bid_count = sum(
                      1
                      for x in last_two
                      if x["weak_bid"]
                  )


                  price_fail_count = sum(
                      1
                      for x in last_two
                      if x["price_failed"]
                  )


                  price_near_count = sum(
                      1
                      for x in last_two
                      if x["price_near_ask"]
                  )


                  replenishment_count = sum(
                      1
                      for x in last_two
                      if x["replenishment"]
                  )


                  # ----------------------------------------------------
                  # CONFIRM CONDITIONS
                  # ----------------------------------------------------

                  confirmed = (

                      ask_wall_count >= 2

                      and

                      weak_bid_count >= 2

                      and

                      price_fail_count >= 2

                      and

                      price_near_count >= 2

                      and

                      replenishment_count >= 1

                  )


                  if not confirmed:

                      return


                  # ----------------------------------------------------
                  # LTP MUST BE FALLING
                  # ----------------------------------------------------

                  previous = previous_ltp.get(
                      stock
                  )


                  if previous is not None:

                      if ltp >= previous:

                          previous_ltp[
                              stock
                          ] = ltp

                          return


                  previous_ltp[
                      stock
                  ] = ltp


                  # ----------------------------------------------------
                  # COOLDOWN
                  # ----------------------------------------------------

                  now_timestamp = time.time()

                  last_signal = last_signal_time.get(
                      stock,
                      0
                  )


                  if (
                      now_timestamp
                      - last_signal
                      < SIGNAL_COOLDOWN
                  ):

                      return


                  # ----------------------------------------------------
                  # SELL SIGNAL
                  # ----------------------------------------------------

                  last_signal_time[
                      stock
                  ] = now_timestamp


                  message = (

                      "🔴 PAUL STYLE SELL SIGNAL\n\n"

                      f"📌 {stock}\n"

                      f"💰 LTP: ₹{ltp:.2f}\n"

                      f"🟢 Bid Qty: {bid_qty:.0f}\n"

                      f"🔴 Ask Qty: {ask_qty:.0f}\n"

                      f"📉 Bid/Ask: "
                      f"{bid_qty / ask_qty:.2f}\n"

                      f"💥 Ask Replenishment: YES\n"

                      f"❌ Price Failed Near Ask\n\n"

                      f"⏰ "
                      f"{now_ist().strftime('%H:%M:%S')} IST"

                  )


                  print()
                  print("=" * 70)
                  print(message)
                  print("=" * 70)
                  print()


                  send_telegram(
                      message
                  )


                  save_signal(
                      stock,
                      info=observation
                  )


              except Exception as e:

                  print(
                      f"⚠️ Process error "
                      f"{token}: {e}"
                  )


          # ============================================================
          # WEBSOCKET CALLBACKS
          # ============================================================

          def on_data(wsapp, message):

              try:

                  # ----------------------------------------------------
                  # MESSAGE CAN BE DICT
                  # ----------------------------------------------------

                  if isinstance(
                      message,
                      dict
                  ):

                      token = message.get(
                          "token"
                      )

                      if token:

                          process_quote(
                              token,
                              message
                          )

                          return


                  # ----------------------------------------------------
                  # MESSAGE CAN BE JSON STRING
                  # ----------------------------------------------------

                  import json

                  if isinstance(
                      message,
                      str
                  ):

                      obj = json.loads(
                          message
                      )

                      if isinstance(
                          obj,
                          dict
                      ):

                          token = obj.get(
                              "token"
                          )

                          if token:

                              process_quote(
                                  token,
                                  obj
                              )


              except Exception as e:

                  print(
                      "⚠️ WebSocket data error:",
                      e
                  )


          def on_open(wsapp):

              print()
              print(
                  "🟢 WebSocket connected"
              )

              print(
                  "📡 Subscribing 5 stocks..."
              )


              token_list = [

                  {

                      "exchangeType": 1,

                      "tokens": list(
                          STOCKS.keys()
                      )

                  }

              ]


              try:

                  wsapp.subscribe(
                      "paul-sell-scanner",
                      3,
                      token_list
                  )

                  print(
                      "✅ Subscription sent"
                  )

                  print(
                      "📊 MODE 3 SNAP QUOTE"
                  )

                  print(
                      "📌 Stocks:",
                      ", ".join(
                          STOCKS.values()
                      )
                  )

                  print()

              except Exception as e:

                  print(
                      "❌ Subscription error:",
                      e
                  )


          def on_error(wsapp, error):

              print(
                  "❌ WebSocket error:",
                  error
              )


          def on_close(wsapp):

              print()
              print(
                  "🔴 WebSocket closed"
              )


          # ============================================================
          # STOP THREAD
          # ============================================================

          def stop_at_11():

              global sws

              while True:

                  current = market_time()


                  if current >= END_TIME:

                      print()
                      print(
                          "🛑 11:00 IST reached"
                      )

                      print(
                          "🛑 Stopping scanner..."
                      )


                      try:

                          if sws:

                              sws.close_connection()

                      except Exception as e:

                          print(
                              "⚠️ Close error:",
                              e
                          )

                      break


                  time.sleep(1)


          # ============================================================
          # MAIN
          # ============================================================

          def main():

              global sws


              print()
              print("=" * 70)
              print(
                  "🚀 STARTING PAUL STYLE "
                  "ORDER BOOK SELL SCANNER"
              )
              print("=" * 70)

              print(
                  "ONLY 5 STOCKS:"
              )

              print(
                  ", ".join(
                      STOCKS.values()
                  )
              )

              print()

              print(
                  "TIME: 09:15 → 11:00 IST"
              )

              print(
                  "ASK TARGET:",
                  ASK_TARGET
              )

              print(
                  "ASK TOLERANCE:",
                  f"±{ASK_TOLERANCE}"
              )

              print(
                  "MODE: 3 SNAP QUOTE"
              )

              print(
                  "FLOW: WATCH → CONFIRM → SELL"
              )

              print()


              # ========================================================
              # TIME DEBUG
              # ========================================================

              print(
                  "UTC NOW :",
                  datetime.now(
                      timezone.utc
                  ).strftime(
                      "%Y-%m-%d %H:%M:%S"
                  )
              )

              print(
                  "IST NOW :",
                  now_ist().strftime(
                      "%Y-%m-%d %H:%M:%S"
                  )
              )

              print()


              # ========================================================
              # CHECK CREDENTIALS
              # ========================================================

              if not API_KEY:

                  print(
                      "❌ ANGEL_API_KEY missing"
                  )

                  return


              if not CLIENT_ID:

                  print(
                      "❌ ANGEL_CLIENT_ID missing"
                  )

                  return


              if not PASSWORD:

                  print(
                      "❌ ANGEL_PASSWORD missing"
                  )

                  return


              if not TOTP_SECRET:

                  print(
                      "❌ ANGEL_TOTP missing"
                  )

                  return


              if not TELE_TOKEN:

                  print(
                      "⚠️ TELE_TOKEN missing"
                  )

              if not TELE_CHAT_ID:

                  print(
                      "⚠️ TELE_CHAT_ID missing"
                  )


              # ========================================================
              # WAIT FOR MARKET OPEN
              # ========================================================

              while market_time() < START_TIME:

                  current = now_ist().strftime(
                      "%H:%M:%S"
                  )

                  print(
                      f"⏳ Waiting for 09:15 IST... "
                      f"Current IST: {current}"
                  )

                  time.sleep(5)


              # ========================================================
              # IF ALREADY AFTER 11:00
              # ========================================================

              if market_time() >= END_TIME:

                  print(
                      "🛑 Market scanner time already finished."
                  )

                  return


              print()
              print(
                  "🟢 MARKET WINDOW OPEN"
              )

              print(
                  "⏰ Current IST:",
                  now_ist().strftime(
                      "%H:%M:%S"
                  )
              )

              print()


              # ========================================================
              # ANGEL LOGIN
              # ========================================================

              print(
                  "🔐 Logging into Angel One..."
              )


              try:

                  smart_api = SmartConnect(
                      api_key=API_KEY
                  )


                  totp = pyotp.TOTP(
                      TOTP_SECRET
                  ).now()


                  session = smart_api.generateSession(
                      CLIENT_ID,
                      PASSWORD,
                      totp
                  )


                  if not session:

                      print(
                          "❌ Angel login failed"
                      )

                      return


                  auth_token = session[
                      "data"
                  ][
                      "jwtToken"
                  ]


                  feed_token = smart_api.getfeedToken()


                  print(
                      "✅ Angel login SUCCESS"
                  )

                  print()


              except Exception as e:

                  print(
                      "❌ Angel login error:",
                      e
                  )

                  return


              # ========================================================
              # TELEGRAM TEST
              # ========================================================

              send_telegram(

                  "🟢 PAUL STYLE SELL SCANNER STARTED\n\n"

                  "📊 Stocks: "
                  + ", ".join(
                      STOCKS.values()
                  )
                  + "\n"

                  "⏰ Time: 09:15 → 11:00 IST\n"

                  "📡 Mode: 3 SNAP QUOTE\n"

                  "🔴 Strategy: "
                  "WATCH → CONFIRM → SELL\n\n"

                  "Current IST: "
                  + now_ist().strftime(
                      "%H:%M:%S"
                  )

              )


              # ========================================================
              # STOP THREAD
              # ========================================================

              stopper = threading.Thread(
                  target=stop_at_11,
                  daemon=True
              )

              stopper.start()


              # ========================================================
              # WEBSOCKET
              # ========================================================

              try:

                  sws = SmartWebSocketV2(

                      auth_token,

                      API_KEY,

                      CLIENT_ID,

                      feed_token

                  )


                  sws.on_data = on_data
                  sws.on_open = on_open
                  sws.on_error = on_error
                  sws.on_close = on_close


                  print(
                      "🚀 Connecting WebSocket..."
                  )

                  print()


                  sws.connect()


              except KeyboardInterrupt:

                  print(
                      "🛑 Scanner stopped by user"
                  )


              except Exception as e:

                  print(
                      "❌ WebSocket connection error:",
                      e
                  )


              finally:

                  print()
                  print("=" * 70)
                  print(
                      "🛑 SCANNER FINISHED"
                  )
                  print(
                      "FINAL IST TIME:",
                      now_ist().strftime(
                          "%H:%M:%S"
                      )
                  )
                  print("=" * 70)


          # ============================================================
          # RUN
          # ============================================================

          if __name__ == "__main__":

              main()

          PYTHON


      # ============================================================
      # RUN SCANNER
      # ============================================================
      - name: Run Scanner
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP: ${{ secrets.ANGEL_TOTP }}

          TELE_TOKEN: ${{ secrets.TELE_TOKEN }}
          TELE_CHAT_ID: ${{ secrets.TELE_CHAT_ID }}

        run: |

          echo "=============================================="
          echo "🚀 PAUL STYLE SELL SCANNER"
          echo "=============================================="

          echo "GitHub Runner UTC:"
          date -u

          echo "System local time:"
          date

          echo "Starting Python scanner..."

          python scanner.py


      # ============================================================
      # UPLOAD SIGNAL CSV
      # ============================================================
      - name: Upload Signal CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paul-sell-signals
          path: paul_sell_signals.csv
          if-no-files-found: ignore
