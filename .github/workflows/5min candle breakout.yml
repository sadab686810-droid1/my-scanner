
name: NSE FNO 5 Minute Breakout Scanner

on:
  schedule:
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-fno-breakout-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install smartapi-python pyotp requests

      - name: Initialize scanner state
        run: |
          if [ ! -f scanner_state.json ]; then
            echo '{"date":"","last_processed":{}}' > scanner_state.json
          fi

      - name: Run scanner
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP: ${{ secrets.ANGEL_TOTP }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Save scanner state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch scanner_state.json
          git add scanner_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update scanner state"
            git push
          fi
