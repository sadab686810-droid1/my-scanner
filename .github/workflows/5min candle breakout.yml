on:
  schedule:
    # Every 5 minutes, covering the Indian market session
    - cron: "*/5 3-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
import json
import os
import time
from datetime import datetime, timedelta, time as clock_time
from zoneinfo import ZoneInfo

import pyotp
import requests
from SmartApi import SmartConnect

IST = ZoneInfo("Asia/Kolkata")
MASTER_URL = "https://margincalculator.angelone.in/OpenAPI_File/files/OpenAPIScripMaster.json"
MASTER_FILE = "OpenAPIScripMaster.json"
STATE_FILE = "scanner_state.json"

MARKET_START = clock_time(9, 15)
MARKET_END = clock_time(15, 30)
REQUEST_DELAY_SECONDS = 0.55
OPENING_CANDLE_TIME = "09:15"
CANDLE_MINUTES = 5
BODY_MIN_PERCENT = 70.0
OPEN_LOW_TOLERANCE = 0.01  # Handles minor floating-point representation differences.


def log(message):
    print(f"[{datetime.now(IST):%Y-%m-%d %H:%M:%S}] {message}", flush=True)


def required_env(name):
    value = os.getenv(name, "").strip()
    if not value:
        raise RuntimeError(f"Missing required GitHub Actions secret: {name}")
    return value


def telegram(message):
    url = f"https://api.telegram.org/bot{required_env('TELEGRAM_BOT_TOKEN')}/sendMessage"
    response = requests.post(
        url,
        data={"chat_id": required_env("TELEGRAM_CHAT_ID"), "text": message},
        timeout=20,
    )
    response.raise_for_status()
    result = response.json()
    if not result.get("ok"):
        raise RuntimeError(f"Telegram send failed: {result}")


def login():
    api = SmartConnect(api_key=required_env("ANGEL_API_KEY"))
    client_id = required_env("ANGEL_CLIENT_ID")
    password = required_env("ANGEL_PASSWORD")
    otp_or_secret = required_env("ANGEL_TOTP")

    otp = (
        otp_or_secret
        if len(otp_or_secret) == 6 and otp_or_secret.isdigit()
        else pyotp.TOTP(otp_or_secret).now()
    )
    result = api.generateSession(client_id, password, otp)
    if not result or not result.get("status"):
        raise RuntimeError(f"Angel One login failed: {result}")
    log("Angel One login successful")
    return api


def load_master_data():
    temp_file = MASTER_FILE + ".part"
    last_error = None

    for attempt in range(1, 4):
        try:
            log(f"Downloading instrument master (attempt {attempt}/3)")
            with requests.get(
                MASTER_URL,
                stream=True,
                timeout=(20, 120),
                headers={"User-Agent": "Mozilla/5.0"},
            ) as response:
                response.raise_for_status()
                with open(temp_file, "wb") as output:
                    for chunk in response.iter_content(chunk_size=256 * 1024):
                        if chunk:
                            output.write(chunk)

            with open(temp_file, "r", encoding="utf-8") as source:
                data = json.load(source)
            if not isinstance(data, list) or not data:
                raise ValueError("Instrument master is empty or invalid")

            os.replace(temp_file, MASTER_FILE)
            log(f"Instrument master validated: {len(data)} records")
            return data

        except (requests.RequestException, OSError, ValueError) as exc:
            last_error = exc
            log(f"Master download failed: {exc}")
            try:
                if os.path.exists(temp_file):
                    os.remove(temp_file)
            except OSError:
                pass
            if attempt < 3:
                time.sleep(attempt * 2)

    try:
        with open(MASTER_FILE, "r", encoding="utf-8") as source:
            data = json.load(source)
        if isinstance(data, list) and data:
            log(f"WARNING: using cached instrument master; latest download failed: {last_error}")
            return data
    except (OSError, ValueError):
        pass

    raise RuntimeError(f"Could not obtain a valid instrument master: {last_error}")


def get_fno_stocks():
    master = load_master_data()

    fno_names = {
        str(row.get("name", "")).strip().upper()
        for row in master
        if row.get("exch_seg") == "NFO"
        and row.get("instrumenttype") == "FUTSTK"
        and row.get("name")
    }

    stocks = {}
    for row in master:
        symbol = str(row.get("symbol", "")).strip()
        token = str(row.get("token", "")).strip()
        if row.get("exch_seg") != "NSE" or not symbol.endswith("-EQ") or not token:
            continue
        name = symbol[:-3].upper()
        if name in fno_names:
            stocks[name] = {"symbol": symbol, "token": token}

    if not stocks:
        raise RuntimeError("No NSE EQ symbols could be mapped to NFO FUTSTK names")

    log(f"Mapped NSE F&O stocks: {len(stocks)}")
    return dict(sorted(stocks.items()))


def read_state(today):
    try:
        with open(STATE_FILE, "r", encoding="utf-8") as source:
            state = json.load(source)
        if state.get("date") == today:
            for key, default in {
                "daily_filter": {},
                "daily_candle_date": {},
                "opening_high": {},
                "invalid_opening": [],
                "alerted_stocks": [],
                "last_alert_candle": {},
                "last_status_update": 0,
            }.items():
                state.setdefault(key, default)
            return state
    except (OSError, ValueError):
        pass

    return {
        "date": today,
        "daily_filter": {},
        "daily_candle_date": {},
        "opening_high": {},
        "invalid_opening": [],
        "alerted_stocks": [],
        "last_alert_candle": {},
        "last_status_update": 0,
    }


def save_state(state):
    temp = STATE_FILE + ".tmp"
    with open(temp, "w", encoding="utf-8") as output:
        json.dump(state, output, separators=(",", ":"))
    os.replace(temp, STATE_FILE)


def parse_candle_time(candle):
    value = datetime.fromisoformat(str(candle[0]))
    if value.tzinfo is None:
        return value.replace(tzinfo=IST)
    return value.astimezone(IST)


def is_complete_5m(candle, now):
    try:
        return parse_candle_time(candle) + timedelta(minutes=CANDLE_MINUTES) <= now
    except (ValueError, TypeError, IndexError):
        return False


def get_candle_data(api, token, interval, from_date, to_date):
    # Keep every historical candle request spaced out to avoid rate-limit bursts.
    time.sleep(REQUEST_DELAY_SECONDS)
    params = {
        "exchange": "NSE",
        "symboltoken": str(token),
        "interval": interval,
        "fromdate": from_date,
        "todate": to_date,
    }
    last_error = None
    for attempt in range(1, 3):
        try:
            result = api.getCandleData(params)
            if result and result.get("status"):
                return result.get("data") or []
            last_error = RuntimeError(f"API returned status=false: {result}")
            log(f"{interval} candle API failed for token {token}: {result}")
        except Exception as exc:
            last_error = exc
            log(f"{interval} candle API exception token={token}: {exc}")

        if attempt == 1:
            time.sleep(1.2)

    log(f"Could not fetch {interval} candles for token {token}: {last_error}")
    return None


def daily_filter_passes(api, name, stock, state, today, now):
    # Cache the daily-filter result in scanner_state.json for the rest of this trading day.
    if name in state["daily_filter"]:
        return bool(state["daily_filter"][name])

    # Fetch enough calendar days to find the most recent completed trading-day candle.
    start_day = (now.date() - timedelta(days=12)).strftime("%Y-%m-%d")
    end_day = now.strftime("%Y-%m-%d %H:%M")
    candles = get_candle_data(
        api,
        stock["token"],
        "ONE_DAY",
        f"{start_day} 00:00",
        end_day,
    )
    if candles is None:
        # Do not cache transient API failures as a negative filter result.
        return None

    previous_days = []
    for candle in candles:
        try:
            candle_dt = parse_candle_time(candle)
            if candle_dt.date().isoformat() < today and len(candle) >= 5:
                previous_days.append((candle_dt, candle))
        except (ValueError, TypeError, IndexError):
            continue

    if not previous_days:
        log(f"{stock['symbol']}: no previous trading-day daily candle returned")
        return None

    previous_days.sort(key=lambda item: item[0])
    candle_dt, candle = previous_days[-1]

    try:
        open_price, high, low, close = map(float, candle[1:5])
        candle_range = high - low
        body_percent = ((close - open_price) / candle_range * 100.0) if candle_range > 0 else 0.0
        open_equals_low = abs(open_price - low) <= OPEN_LOW_TOLERANCE
        passes = (
            candle_range > 0
            and close > open_price
            and open_equals_low
            and body_percent >= BODY_MIN_PERCENT
        )
    except (ValueError, TypeError, IndexError):
        return None

    state["daily_filter"][name] = bool(passes)
    state["daily_candle_date"][name] = candle_dt.date().isoformat()
    log(
        f"{stock['symbol']}: previous daily candle {candle_dt.date()} "
        f"O={candle[1]} H={candle[2]} L={candle[3]} C={candle[4]} "
        f"body={body_percent:.1f}% Open=Low={open_equals_low} "
        f"FILTER={'PASS' if passes else 'FAIL'}"
    )
    return passes


def scan_breakout(api, name, stock, state, today, now):
    # Apply the previous trading day's DAILY candle filter first.
    filter_result = daily_filter_passes(api, name, stock, state, today, now)
    if filter_result is not True:
        return

    if name in state["invalid_opening"]:
        return

    candles = get_candle_data(
        api,
        stock["token"],
        "FIVE_MINUTE",
        f"{today} 09:15",
        now.strftime("%Y-%m-%d %H:%M"),
    )
    if candles is None:
        return

    completed = []
    for candle in candles:
        try:
            if len(candle) >= 6 and is_complete_5m(candle, now):
                completed.append(candle)
        except Exception:
            continue
    completed.sort(key=parse_candle_time)

    opening = next(
        (c for c in completed if parse_candle_time(c).strftime("%H:%M") == OPENING_CANDLE_TIME),
        None,
    )
    if opening is None:
        # The 09:15 candle has not completed yet, or the API did not return it.
        return

    if name not in state["opening_high"]:
        state["opening_high"][name] = float(opening[2])
        log(f"{stock['symbol']}: saved 09:15 candle high = {float(opening[2]):.2f}")

    opening_high = float(state["opening_high"][name])

    if name in state["alerted_stocks"]:
        return

    for candle in completed:
        candle_dt = parse_candle_time(candle)
        if candle_dt <= parse_candle_time(opening):
            continue

        try:
            close = float(candle[4])
        except (ValueError, TypeError, IndexError):
            continue

        if close > opening_high:
            message = (
                "🟢 NSE F&O 5-MIN BREAKOUT BUY SIGNAL\n"
                "━━━━━━━━━━━━━━━━━━\n"
                f"📌 STOCK: {stock['symbol']}\n"
                f"📅 Previous daily candle: {state['daily_candle_date'].get(name, 'N/A')}\n"
                "✅ Previous daily candle: bullish, Open = Low, body ≥ 70%\n"
                f"🔒 Today's 09:15 High: ₹{opening_high:.2f}\n"
                f"⏰ Breakout candle: {candle_dt:%H:%M} IST\n"
                f"🚀 Breakout candle Close: ₹{close:.2f}\n"
                "✅ Completed 5-minute candle closed above 09:15 High\n"
                "⚠️ Alert only — no order placed."
            )
            # Mark the stock alerted only after Telegram confirms delivery.
            telegram(message)
            state["alerted_stocks"].append(name)
            state["last_alert_candle"][name] = str(candle[0])
            log(f"BUY ALERT SENT: {stock['symbol']} close={close:.2f} at {candle_dt:%H:%M}")
            break


def send_status_update(state, now, total_stocks):
    """
    Send a Telegram scanner-health/status update at most once every 10 minutes.
    This reports the current run's universe and saved state; it does not claim
    every stock has been successfully fetched if individual API calls failed.
    """
    last_sent = float(state.get("last_status_update", 0) or 0)
    if now.timestamp() - last_sent < 300:
        return

    eligible = sum(1 for passed in state.get("daily_filter", {}).values() if passed)
    alerted = len(state.get("alerted_stocks", []))
    opening_saved = len(state.get("opening_high", {}))
    message = (
        "📡 NSE F&O SCANNER — 5-MIN UPDATE\\n"
        "━━━━━━━━━━━━━━━━━━\\n"
        f"⏰ Time: {now:%H:%M} IST\\n"
        "🟢 Status: RUNNING / scan cycle reached\\n"
        f"📋 Mapped NSE F&O stocks: {total_stocks}\\n"
        f"✅ Previous-day filter passed (cached): {eligible}\\n"
        f"🔒 09:15 High saved (eligible stocks): {opening_saved}\\n"
        f"🚀 Stocks with BUY alert today: {alerted}\\n"
        "📌 Rule: previous daily candle bullish, Open = Low, body ≥ 70%; "
        "completed 5-min close > today's 09:15 High.\\n"
        "⚠️ Alert only — no order placed."
    )
    telegram(message)
    state["last_status_update"] = now.timestamp()
    log("10-minute Telegram status update sent")


def main():
    now = datetime.now(IST)
    if now.weekday() >= 5 or not (MARKET_START <= now.time() <= MARKET_END):
        log("Outside market hours; no scan performed")
        return

    today = now.date().isoformat()
    state = read_state(today)
    api = login()

    try:
        stocks = get_fno_stocks()
        total = len(stocks)

        for index, (name, stock) in enumerate(stocks.items(), start=1):
            try:
                scan_breakout(api, name, stock, state, today, now)
            except Exception as exc:
                log(f"ERROR {stock['symbol']}: {exc}")

            if index % 10 == 0:
                save_state(state)
                log(f"Progress: {index}/{total}")

            time.sleep(REQUEST_DELAY_SECONDS)

        send_status_update(state, datetime.now(IST), total)
        save_state(state)
        log(f"Scan completed: {total} mapped F&O stocks")
    finally:
        try:
            api.terminateSession(required_env("ANGEL_CLIENT_ID"))
        except Exception as exc:
            log(f"Session termination warning: {exc}")


if __name__ == "__main__":
    main()
