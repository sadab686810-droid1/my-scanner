name: NSE FNO 5 Minute Breakout Scanner

on:
  schedule:
    # GitHub cron uses UTC. 03:45-09:55 UTC = 09:15-15:25 IST; 10:00 UTC = 15:30 IST.
    - cron: "*/5 4-9 * * 1-5"
    - cron: "45,50,55 3 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-fno-breakout
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install smartapi-python pyotp requests logzero websocket-client

      - name: Scan NSE FNO
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP: ${{ secrets.ANGEL_TOTP }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > /tmp/fno_scanner.py <<'PYTHON'
          import json
          import os
          import time
          from datetime import datetime, timedelta, time as dtime
          from zoneinfo import ZoneInfo

          import pyotp
          import requests
          from SmartApi import SmartConnect

          IST = ZoneInfo("Asia/Kolkata")
          STATE = "scanner_state.json"
          MASTER_URL = "https://margincalculator.angelone.in/OpenAPI_File/files/OpenAPIScripMaster.json"

          # Rate-limit protection: space out candle API calls and back off before retrying.
          REQUEST_GAP = 3.25
          RETRY_WAIT_SECONDS = 30
          STATUS_GAP = 300
          BODY_MIN = 70.0
          OPEN_LOW_TOLERANCE = 0.01
          MARKET_START = dtime(9, 15)
          MARKET_END = dtime(15, 30)

          def log(msg):
              print(f"[{datetime.now(IST):%H:%M:%S}] {msg}", flush=True)

          def env(name):
              value = os.getenv(name, "").strip()
              if not value:
                  raise RuntimeError(f"Missing GitHub Actions secret: {name}")
              return value

          def send(msg):
              response = requests.post(
                  f"https://api.telegram.org/bot{env('TELEGRAM_BOT_TOKEN')}/sendMessage",
                  data={"chat_id": env("TELEGRAM_CHAT_ID"), "text": msg},
                  timeout=20,
              )
              response.raise_for_status()
              result = response.json()
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram API error: {response.text[:300]}")

          def load_state(today):
              try:
                  with open(STATE, encoding="utf-8") as source:
                      state = json.load(source)
                  if state.get("date") == today:
                      state.setdefault("daily", {})
                      state.setdefault("opening", {})
