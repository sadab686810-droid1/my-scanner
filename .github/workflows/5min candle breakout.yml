
name: NSE FNO 5 Minute Breakout Scanner

on:
  schedule:
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-fno-breakout
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

     
      - name: Restore/cache Angel instrument master
        uses: actions/cache@v4
        with:
          path: OpenAPIScripMaster.json
          key: angel-master-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            angel-master-${{ runner.os }}-

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install smartapi-python pyotp requests logzero websocket-client

      - name: Create and run complete scanner
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP: ${{ secrets.ANGEL_TOTP }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > scanner_runtime.py <<'PYTHON'
          import os
          import json
          import time
          import requests
          from datetime import datetime, time as clock_time
          from zoneinfo import ZoneInfo
          import pyotp
          from SmartApi import SmartConnect

          IST = ZoneInfo("Asia/Kolkata")
          MASTER_URL = "https://margincalculator.angelone.in/OpenAPI_File/files/OpenAPIScripMaster.json"
          STATE_FILE = "scanner_state.json"
          BODY_MIN = 75.0

          def log(msg):
              print(f"[{datetime.now(IST):%H:%M:%S}] {msg}", flush=True)

          def telegram(msg):
              r = requests.post(
                  f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
                  data={
                      "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                      "text": msg
                  },
                  timeout=20
              )
              r.raise_for_status()
              if not r.json().get("ok"):
                  raise RuntimeError("Telegram send failed")

          def login():
              otp = os.environ["ANGEL_TOTP"].strip()
              if not (len(otp) == 6 and otp.isdigit()):
                  otp = pyotp.TOTP(otp).now()
              api = SmartConnect(api_key=os.environ["ANGEL_API_KEY"])
              result = api.generateSession(
                  os.environ["ANGEL_CLIENT_ID"],
                  os.environ["ANGEL_PASSWORD"],
                  otp
              )
              if not result or not result.get("status"):
                  raise RuntimeError(f"Angel login failed: {result}")
              log("Angel One login successful")
              return api

          MASTER_FILE = "OpenAPIScripMaster.json"

          def load_master_data():
              """Download the Angel master with retries; use cache only if download fails."""
              temp_file = MASTER_FILE + ".part"
              last_error = None

              for attempt in range(1, 6):
                  try:
                      log(f"Downloading Angel master: attempt {attempt}/5")
                      with requests.get(
                          MASTER_URL,
                          stream=True,
                          timeout=(20, 180),
                          headers={"User-Agent": "Mozilla/5.0"},
                      ) as response:
                          response.raise_for_status()
                          with open(temp_file, "wb") as output:
                              for chunk in response.iter_content(
                                  chunk_size=256 * 1024
                              ):
                                  if chunk:
                                      output.write(chunk)

                      # Verify the entire response is valid JSON before replacing cache.
                      with open(temp_file, "r", encoding="utf-8") as source:
                          master = json.load(source)

                      if not isinstance(master, list) or not master:
                          raise ValueError("Master JSON is empty or not a list")

                      os.replace(temp_file, MASTER_FILE)
                      log(f"Master downloaded and verified: {len(master)} records")
                      return master

                  except (
                      requests.RequestException,
                      OSError,
                      ValueError,
                      json.JSONDecodeError,
                  ) as exc:
                      last_error = exc
                      log(f"Master download attempt {attempt} failed: {exc}")
                      try:
                          if os.path.exists(temp_file):
                              os.remove(temp_file)
                      except OSError:
                          pass
                      if attempt < 5:
                          time.sleep(attempt * 3)

              # A previously cached valid master is a fallback only; never use a partial file.
              try:
                  with open(MASTER_FILE, "r", encoding="utf-8") as source:
                      master = json.load(source)
                  if isinstance(master, list) and master:
                      log(
                          f"WARNING: using cached master after download failures "
                          f"({len(master)} records); last error: {last_error}"
                      )
                      return master
              except (OSError, ValueError, json.JSONDecodeError):
                  pass

              raise RuntimeError(
                  f"Could not download Angel master after 5 attempts and no valid "
                  f"cached copy was available. Last error: {last_error}"
              )

          def get_stocks():
              master = load_master_data()
              names = {
                  str(x.get("name", "")).strip().upper()
                  for x in master
                  if x.get("exch_seg") == "NFO"
                  and x.get("instrumenttype") == "FUTSTK"
                  and x.get("name")
              }
              stocks = {}
              for x in master:
                  symbol = str(x.get("symbol", "")).strip()
                  token = str(x.get("token", "")).strip()
                  if x.get("exch_seg") != "NSE" or not symbol.endswith("-EQ"):
                      continue
                  name = symbol[:-3].upper()
                  if name in names and token:
                      stocks[name] = {"symbol": symbol, "token": token}
              if not stocks:
                  raise RuntimeError("No NSE F&O stocks mapped")
              log(f"Mapped F&O stocks: {len(stocks)}")
              return stocks

          def read_state(today):
              try:
                  with open(STATE_FILE, encoding="utf-8") as f:
                      s = json.load(f)
                  if s.get("date") == today:
                      s.setdefault("opening_high", {})
                      s.setdefault("last_processed", {})
                      s.setdefault("last_alert_candle", {})
                      s.setdefault("alerted_stocks", [])
                      s.setdefault("invalid_open", [])
                      return s
              except (OSError, ValueError):
                  pass
              return {
                  "date": today,
                  "opening_high": {},
                  "last_processed": {},
                  "last_alert_candle": {},
                  "alerted_stocks": [],
                  "invalid_open": []
              }

          def save_state(state):
              temp = STATE_FILE + ".tmp"
              with open(temp, "w", encoding="utf-8") as f:
                  json.dump(state, f)
              os.replace(temp, STATE_FILE)

          def get_candles(api, token, today, now):
              result = api.getCandleData({
                  "exchange": "NSE",
                  "symboltoken": str(token),
                  "interval": "FIVE_MINUTE",
                  "fromdate": f"{today} 09:15",
                  "todate": now.strftime("%Y-%m-%d %H:%M")
              })
              if not result or not result.get("status"):
                  log(f"Candle request failed for token {token}: {result}")
                  return None
              return result.get("data") or []

          def stamp(c):
              dt = datetime.fromisoformat(str(c[0]))
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=IST)
              else:
                  dt = dt.astimezone(IST)
              return dt

          def complete(c, now):
              try:
                  return stamp(c).timestamp() + 300 <= now.timestamp()
              except (ValueError, TypeError, IndexError):
                  return False

          def valid_opening(c):
              try:
                  o, h, l, close = map(float, c[1:5])
                  rng = h - l
                  if rng <= 0:
                      return False
                  body = abs(close - o) / rng * 100
                  return close > o and body >= BODY_MIN
              except (ValueError, TypeError, IndexError):
                  return False

          def scan_one(api, name, stock, state, today, now):
              candles = get_candles(api, stock["token"], today, now)
              if candles is None:
                  return

              candles = sorted(
                  [c for c in candles if complete(c, now)],
                  key=stamp
              )
              if not candles:
                  return

              opening = next(
                  (c for c in candles if stamp(c).strftime("%H:%M") == "09:15"),
                  None
              )
              if opening is None:
                  return

              if name in state["invalid_open"]:
                  return

              if name not in state["opening_high"]:
                  if not valid_opening(opening):
                      state["invalid_open"].append(name)
                      state["last_processed"][name] = candles[-1][0]
                      log(f"{stock['symbol']}: opening candle invalid; BUY setup disabled today")
                      return

                  state["opening_high"][name] = float(opening[2])
                  log(f"{stock['symbol']} opening high: {opening[2]}")

              opening_high = float(state["opening_high"][name])

              # Check the latest completed 5-minute candle on every run.
              # Send another update only when a NEW candle qualifies.
              latest = candles[-1]
              latest_dt = stamp(latest)
              if latest_dt == stamp(opening) or len(candles) < 2:
                  state["last_processed"][name] = latest[0]
                  return

              previous = candles[-2]
              close = float(latest[4])
              volume = float(latest[5])
              previous_volume = float(previous[5])
              last_alert_candle = state["last_alert_candle"].get(name)

              qualifies = close > opening_high and volume > previous_volume
              if qualifies and last_alert_candle != latest[0]:
                  already_alerted = name in state["alerted_stocks"]
                  title = (
                      "🔄 NSE F&O BREAKOUT UPDATE"
                      if already_alerted
                      else "🟢 NSE F&O BREAKOUT BUY SIGNAL"
                  )
                  message = (
                      f"{title}\\n"
                      "━━━━━━━━━━━━━━━━━━\\n"
                      f"📌 STOCK: {stock['symbol']}\\n"
                      f"⏰ COMPLETED CANDLE: {latest_dt:%H:%M} IST\\n"
                      f"🔒 OPENING HIGH: ₹{opening_high:.2f}\\n"
                      f"🚀 LATEST CLOSE: ₹{close:.2f}\\n"
                      f"📊 CANDLE VOLUME: {volume:,.0f}\\n"
                      f"📉 PREVIOUS CANDLE VOLUME: {previous_volume:,.0f}\\n"
                      "✅ Close above opening high\\n"
                      "✅ Volume greater than previous candle\\n"
                      "🔔 Another qualifying 5-minute candle can send an update.\\n"
                      "⚠️ Alert only; no order placed."
                  )

                  # Record the candle only after Telegram confirms delivery.
                  telegram(message)
                  state["last_alert_candle"][name] = latest[0]
                  if name not in state["alerted_stocks"]:
                      state["alerted_stocks"].append(name)
                  log(
                      f"BREAKOUT UPDATE: {stock['symbol']} "
                      f"candle={latest_dt:%H:%M} close={close:.2f}"
                  )

              state["last_processed"][name] = latest[0]

          def main():
              now = datetime.now(IST)
              if now.weekday() >= 5 or not (
                  clock_time(9, 15) <= now.time() <= clock_time(15, 30)
              ):
                  log("Outside market hours")
                  return

              today = now.strftime("%Y-%m-%d")
              state = read_state(today)
              api = login()
              stocks = get_stocks()

              try:
                  for i, (name, stock) in enumerate(stocks.items(), 1):
                      try:
                          scan_one(api, name, stock, state, today, now)
                      except Exception as e:
                          log(f"ERROR {stock['symbol']}: {e}")

                      if i % 10 == 0:
                          save_state(state)
                          log(f"Progress: {i}/{len(stocks)}")
                      time.sleep(0.55)

                  save_state(state)
                  log("Scan completed")
              finally:
                  try:
                      api.terminateSession(os.environ["ANGEL_CLIENT_ID"])
                  except Exception:
                      pass

          if __name__ == "__main__":
              main()
          PYTHON
          python scanner_runtime.py

      - name: Save scanner progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch scanner_state.json
          git add scanner_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update scanner state"
            git push
          fi
