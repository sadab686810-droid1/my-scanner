name: NSE FNO 5 Minute Breakout Scanner

on:
  schedule:
    # UTC: 03:45-09:55 = 09:15-15:25 IST; final 10:00 = 15:30 IST
    - cron: '*/5 4-9 * * 1-5'
    - cron: '45,50,55 3 * * 1-5'
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-fno-breakout
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install smartapi-python pyotp requests logzero websocket-client
      - name: Scan NSE FNO
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP: ${{ secrets.ANGEL_TOTP }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > /tmp/fno_scanner.py <<'PYTHON'
          import os, json, time, requests, pyotp
          from datetime import datetime, timedelta, time as dtime
          from zoneinfo import ZoneInfo
          from SmartApi import SmartConnect

          IST = ZoneInfo('Asia/Kolkata')
          STATE = 'scanner_state.json'
          MASTER = 'OpenAPIScripMaster.json'
          MASTER_URL = 'https://margincalculator.angelone.in/OpenAPI_File/files/OpenAPIScripMaster.json'
          REQUEST_GAP = 0.45
          STATUS_GAP = 300
          BODY_MIN = 70.0
          # One exchange tick tolerance; set to 0 for exact equality.
          OPEN_LOW_TOLERANCE = 0.01

          def log(msg):
              print(f'[{datetime.now(IST):%H:%M:%S}] {msg}', flush=True)

          def env(name):
              value = os.getenv(name, '').strip()
              if not value:
                  raise RuntimeError(f'Missing secret: {name}')
              return value

          def send(msg):
              r = requests.post(
                  f'https://api.telegram.org/bot{env("TELEGRAM_BOT_TOKEN")}/sendMessage',
                  data={'chat_id': env('TELEGRAM_CHAT_ID'), 'text': msg}, timeout=20)
              r.raise_for_status()
              if not r.json().get('ok'):
                  raise RuntimeError(f'Telegram error: {r.text[:300]}')

          def load_state(today):
              try:
                  with open(STATE, encoding='utf-8') as f:
                      s = json.load(f)
                  if s.get('date') == today:
                      for key, default in [('daily', {}), ('opening', {}),
                                           ('alerted', {}), ('last_status', 0)]:
                          s.setdefault(key, default)
                      return s
              except (OSError, ValueError):
                  pass
              return {'date': today, 'daily': {}, 'opening': {},
                      'alerted': {}, 'last_status': 0}

          def save(s):
              with open(STATE + '.tmp', 'w', encoding='utf-8') as f:
                  json.dump(s, f)
              os.replace(STATE + '.tmp', STATE)

          def ts(c):
              dt = datetime.fromisoformat(str(c[0]))
              return dt.replace(tzinfo=IST) if dt.tzinfo is None else dt.astimezone(IST)

          def get_master():
              for attempt in range(3):
                  try:
                      r = requests.get(MASTER_URL, timeout=90)
                      r.raise_for_status()
                      rows = r.json()
                      if not isinstance(rows, list) or not rows:
                          raise ValueError('Invalid instrument master')
                      return rows
                  except (requests.RequestException, ValueError) as e:
                      log(f'Master retry {attempt+1}: {e}')
                      time.sleep(2)
              raise RuntimeError('Cannot download Angel instrument master')

          def stocks_from_master(rows):
              names = {str(x.get('name', '')).upper().strip() for x in rows
                       if x.get('exch_seg') == 'NFO'
                       and x.get('instrumenttype') == 'FUTSTK'}
              stocks = {}
              for x in rows:
                  sym = str(x.get('symbol', '')).strip()
                  token = str(x.get('token', '')).strip()
                  if x.get('exch_seg') == 'NSE' and sym.endswith('-EQ') and token:
                      name = sym[:-3].upper()
                      if name in names:
                          stocks[name] = token
              if not stocks:
                  raise RuntimeError('No NSE FNO equity symbols mapped')
              return dict(sorted(stocks.items()))

          def candles(api, token, interval, start, end):
              params = {'exchange': 'NSE', 'symboltoken': token,
                        'interval': interval, 'fromdate': start, 'todate': end}
              for attempt in range(2):
                  time.sleep(REQUEST_GAP)
                  try:
                      r = api.getCandleData(params)
                      if r and r.get('status'):
                          return r.get('data') or []
                      log(f'{interval} token {token}: {str(r)[:180]}')
                  except Exception as e:
                      log(f'{interval} token {token}: {e}')
                  if attempt == 0:
                      time.sleep(1.5)
              return None

          def previous_day(api, token, today, now):
              start = (now.date() - timedelta(days=14)).strftime('%Y-%m-%d 00:00')
              rows = candles(api, token, 'ONE_DAY', start, now.strftime('%Y-%m-%d %H:%M'))
              if rows is None:
                  return None
              prior = []
              for c in rows:
                  try:
                      if len(c) >= 5 and ts(c).date() < now.date():
                          prior.append(c)
                  except (ValueError, TypeError, IndexError):
                      continue
              if not prior:
                  return None
              c = max(prior, key=ts)
              try:
                  o, h, l, close = map(float, c[1:5])
                  rng = h-l
                  body = 100*(close-o)/rng if rng > 0 else 0
                  passed = rng > 0 and close > o and abs(o-l) <= OPEN_LOW_TOLERANCE and body >= BODY_MIN
                  return {'pass': bool(passed), 'date': ts(c).date().isoformat(),
                          'body': round(body, 2)}
              except (ValueError, TypeError):
                  return None

          def scan_one(api, name, token, s, today, now):
              if name not in s['daily']:
                  d = previous_day(api, token, today, now)
                  if d is None:
                      return
                  s['daily'][name] = d
                  if d['pass']:
                      log(f'{name} DAILY PASS body={d["body"]}%')
              d = s['daily'][name]
              if not d['pass'] or name in s['alerted']:
                  return
              rows = candles(api, token, 'FIVE_MINUTE', today+' 09:15',
                             now.strftime('%Y-%m-%d %H:%M'))
              if rows is None:
                  return
              valid = []
              for c in rows:
                  try:
                      if len(c) >= 5 and ts(c) + timedelta(minutes=5) <= now:
                          valid.append(c)
                  except (ValueError, TypeError, IndexError):
                      pass
              valid.sort(key=ts)
              opening = next((c for c in valid if ts(c).strftime('%H:%M') == '09:15'), None)
              if opening is None:
                  return
              if name not in s['opening']:
                  s['opening'][name] = float(opening[2])
                  log(f'{name} opening high={s["opening"][name]}')
              opening_high = s['opening'][name]
              for c in valid:
                  if ts(c) <= ts(opening):
                      continue
                  try:
                      close = float(c[4])
                  except (ValueError, TypeError):
                      continue
                  if close > opening_high:
                      msg = ('🟢 NSE F&O BREAKOUT BUY\n'
                             f'Stock: {name}-EQ\n'
                             f'Previous daily: {d["date"]}\n'
                             f'Previous daily Open=Low, body: {d["body"]}%\n'
                             f'Today 09:15 high: ₹{opening_high:.2f}\n'
                             f'Breakout candle: {ts(c):%H:%M} IST\n'
                             f'5-min close: ₹{close:.2f}\n'
                             'Alert only; no order placed.')
                      send(msg)
                      s['alerted'][name] = str(c[0])
                      save(s)
                      log(f'BUY {name} {ts(c):%H:%M}')
                      return

          def status(s, total):
              now = datetime.now(IST)
              if now.timestamp() - float(s.get('last_status', 0)) < STATUS_GAP:
                  return
              eligible = sum(bool(v['pass']) for v in s['daily'].values())
              msg = ('📡 NSE F&O SCANNER — 5-MIN UPDATE\n'
                     f'Time: {now:%H:%M:%S} IST\n'
                     f'Mapped F&O stocks: {total}\n'
                     f'Daily candles checked: {len(s["daily"])}\n'
                     f'Previous-day filter PASS: {eligible}\n'
                     f'09:15 highs saved: {len(s["opening"])}\n'
                     f'BUY alerts today: {len(s["alerted"])}\n'
                     'Scan cycle completed. No auto orders.')
              send(msg)
              s['last_status'] = now.timestamp()
              save(s)
              log('5-minute status sent')

          def main():
              now = datetime.now(IST)
              if now.weekday() >= 5 or not (dtime(9,15) <= now.time() <= dtime(15,30)):
                  log('Outside NSE market hours')
                  return
              today = now.date().isoformat()
              s = load_state(today)
              client = env('ANGEL_CLIENT_ID')
              totp = env('ANGEL_TOTP')
              otp = totp if len(totp) == 6 and totp.isdigit() else pyotp.TOTP(totp).now()
              api = SmartConnect(api_key=env('ANGEL_API_KEY'))
              result = api.generateSession(client, env('ANGEL_PASSWORD'), otp)
              if not result or not result.get('status'):
                  raise RuntimeError(f'Angel login failed: {result}')
              try:
                  stocks = stocks_from_master(get_master())
                  log(f'Mapped {len(stocks)} FNO stocks')
                  errors = 0
                  for i, (name, token) in enumerate(stocks.items(), 1):
                      try:
                          scan_one(api, name, token, s, today, now)
                      except Exception as e:
                          errors += 1
                          log(f'ERROR {name}: {e}')
                      if i % 10 == 0:
                          save(s)
                          log(f'Progress {i}/{len(stocks)}')
                  save(s)
                  status(s, len(stocks))
                  log(f'Completed. Stock errors: {errors}')
              finally:
                  try:
                      api.terminateSession(client)
                  except Exception:
                      pass

          if __name__ == '__main__':
              main()
          PYTHON
          python -u /tmp/fno_scanner.py

      - name: Commit scanner state
        if: always()
        run: |
          if [ -s scanner_state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add scanner_state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Save scanner state [skip ci]'
              git pull --rebase origin "${{ github.event.repository.default_branch }}"
              git push origin HEAD:"${{ github.event.repository.default_branch }}"
            fi
          fi
