# ============================================================
# CANDLE BUILDER
# ============================================================

def update_candle(
    name,
    tick
):

    ltp = tick.get(
        "ltp",
        0
    )

    volume = tick.get(
        "volume",
        0
    )

    ts = tick.get(
        "timestamp"
    )

    if not ts:
        return

    minute = (
        datetime.fromtimestamp(
            ts,
            IST
        )
        .replace(
            second=0,
            microsecond=0
        )
    )

    key = minute.strftime(
        "%Y-%m-%d %H:%M"
    )

    state = CANDLES.setdefault(
        name,
        {}
    )

    candle = state.get(
        key
    )

    if candle is None:

        candle = {

            "date":
                minute.strftime(
                    "%Y-%m-%d"
                ),

            "slot":
                minute.strftime(
                    "%H:%M"
                ),

            "open": ltp,
            "high": ltp,
            "low": ltp,
            "close": ltp,

            "volume_start":
                volume,

            "volume_last":
                volume

        }

        state[key] = candle

    else:

        candle["high"] = max(
            candle["high"],
            ltp
        )

        candle["low"] = min(
            candle["low"],
            ltp
        )

        candle["close"] = ltp

        candle["volume_last"] = volume


# ============================================================
# SAVE COMPLETED CANDLES
# ============================================================

def save_completed_candles():

    today = now_ist().strftime(
        "%Y-%m-%d"
    )

    current_minute = (
        now_ist()
        .replace(
            second=0,
            microsecond=0
        )
        .strftime(
            "%Y-%m-%d %H:%M"
        )
    )


    for name, candles in CANDLES.items():

        for key, c in candles.items():

            # Do not save current incomplete candle
            if key == current_minute:
                continue

            if c["date"] != today:
                continue

            volume = max(
                0,
                c["volume_last"]
                - c["volume_start"]
            )

            slot = c["slot"]

            HISTORY.setdefault(
                name,
                {}
            )

            HISTORY[name].setdefault(
                slot,
                {}
            )

            HISTORY[name][slot][today] = volume


    # Keep latest 25 sessions
    for name in HISTORY:

        for slot in HISTORY[name]:

            dates = sorted(
                HISTORY[name][slot].keys()
            )

            if len(dates) > 25:

                old_dates = dates[:-25]

                for d in old_dates:

                    del HISTORY[name][slot][d]


    save_history()


# ============================================================
# 20D SAME SLOT AVERAGE
# ============================================================

def volume_20d_average(
    name,
    slot,
    today
):

    records = (
        HISTORY
        .get(name, {})
        .get(slot, {})
    )

    values = [

        float(v)

        for d, v in records.items()

        if d != today

    ]

    values = values[
        -REQUIRED_HISTORY_DAYS:
    ]

    if len(values) < REQUIRED_HISTORY_DAYS:
        return None

    return sum(values) / len(values)


# ============================================================
# UPDATE LIVE TICK
# ============================================================

def process_tick(
    token,
    message
):

    try:

        token = str(token)

        instrument = WATCHLIST.get(
            token
        )

        if not instrument:
            return

        name = instrument["name"]
        kind = instrument["kind"]


        ltp_raw = message.get(
            "last_traded_price",
            0
        )

        ltp = float(
            ltp_raw
        ) / 100


        volume = float(
            message.get(
                "volume_trade_for_the_day",
                0
            )
        )


        oi = float(
            message.get(
                "open_interest",
                0
            )
        )


        close = float(
            message.get(
                "closed_price",
                0
            )
        ) / 100


        avg_price = float(
            message.get(
                "average_traded_price",
                0
            )
        ) / 100


        exchange_timestamp = message.get(
            "exchange_timestamp",
            0
        )


        if exchange_timestamp:

            ts = (
                float(
                    exchange_timestamp
                ) / 1000
            )

        else:

            ts = (
                now_ist()
                .timestamp()
            )


        old = LIVE.get(
            token
        )


        if old is None:

            opening_oi = oi

        else:

            opening_oi = old.get(
                "opening_oi",
                oi
            )


        # SmartAPI OI change field
        api_oi_change = message.get(
            "open_interest_change_percentage"
        )

        try:

            if api_oi_change is not None:

                api_oi_change = float(
                    api_oi_change
                )

        except Exception:

            api_oi_change = None


        LIVE[token] = {

            "name": name,
            "kind": kind,

            "ltp": ltp,
            "volume": volume,

            "oi": oi,
            "opening_oi": opening_oi,

            "oi_change_percent":
                api_oi_change,

            "close": close,

            "vwap":
                avg_price,

            "timestamp": ts,

            "message": message

        }


        if kind == "SPOT":

            update_candle(
                name,
                LIVE[token]
            )


        if kind == "FUTURE":

            pc = price_change(
                LIVE[token]
            )

            oc = oi_change_percent(
                LIVE[token]
            )

            print(

                f"FUT {name:<12} "

                f"LTP={ltp:.2f} "

                f"PC="
                f"{pc if pc is not None else 0:.2f}% "

                f"OI="
                f"{oi / 10000000:.2f}Cr "

                f"OIchg="
                f"{oc if oc is not None else 0:.2f}%"

            )


    except Exception as e:

        print(
            "⚠️ Tick error:",
            e
        )


# ============================================================
# BUILD WATCHLIST
# ============================================================

def build_watchlist():

    global WATCHLIST

    WATCHLIST = {}


    if NIFTY_FUTURE:

        token = str(
            NIFTY_FUTURE["token"]
        )

        WATCHLIST[token] = {

            "name": "NIFTY",
            "kind": "NIFTY_FUTURE"

        }


    for name, contracts in FUTURES.items():

        if not contracts:
            continue

        future = contracts[0]

        future_token = str(
            future["token"]
        )

        spot = SPOTS.get(
            name
        )

        if not spot:
            continue

        spot_token = str(
            spot["token"]
        )


        WATCHLIST[future_token] = {

            "name": name,
            "kind": "FUTURE"

        }


        WATCHLIST[spot_token] = {

            "name": name,
            "kind": "SPOT"

        }


    print()

    print(
        "📡 Initial subscriptions:"
    )

    print(
        "NIFTY +",
        len(FUTURES),
        "stock futures"
    )


# ============================================================
# SELECT CANDIDATES
# ============================================================

def select_candidates():

    candidates = []


    nf = None

    if NIFTY_FUTURE:

        nf = LIVE.get(
            str(
                NIFTY_FUTURE["token"]
            )
        )


    if not nf:
        return []


    # NIFTY FUTURE > VWAP
    if nf["vwap"] <= 0:
        return []

    if nf["ltp"] <= nf["vwap"]:
        return []


    for name, contracts in FUTURES.items():

        if not contracts:
            continue


        future = contracts[0]

        future_token = str(
            future["token"]
        )


        spot = SPOTS.get(
            name
        )

        if not spot:
            continue


        spot_token = str(
            spot["token"]
        )


        f = LIVE.get(
            future_token
        )

        s = LIVE.get(
            spot_token
        )


        if not f or not s:
            continue


        pc = price_change(
            f
        )

        oi_pc = oi_change_percent(
            f
        )


        if pc is None:
            continue

        if oi_pc is None:
            continue


        current_oi = f["oi"]


        # Futures price > +1.5%
        if pc <= FUTURES_PRICE_CHANGE_MIN:
            continue


        # OI change > +2%
        if oi_pc <= FUTURES_OI_CHANGE_MIN:
            continue


        # Current OI > 3 Cr
        if current_oi <= FUTURES_MIN_OI:
            continue


        # Long buildup
        if pc <= 0 or oi_pc <= 0:
            continue


        # Stock spot > VWAP
        if s["vwap"] <= 0:
            continue

        if s["ltp"] <= s["vwap"]:
            continue


        # ATM CE
        ce = find_atm_ce(
            name,
            s["ltp"]
        )


        if not ce:
            continue


        ce_token = str(
            ce["token"]
        )


        candidates.append({

            "name": name,

            "future": future,

            "future_live": f,

            "spot_live": s,

            "ce": ce,

            "ce_token": ce_token

        })


    return candidates


# ============================================================
# OPTION SUBSCRIPTION
# ============================================================

def subscribe_options(
    candidates
):

    new_tokens = []


    for c in candidates:

        token = str(
            c["ce_token"]
        )


        WATCHLIST[token] = {

            "name": c["name"],
            "kind": "OPTION"

        }


        if token not in SUBSCRIBED_OPTION_TOKENS:

            new_tokens.append(
                token
            )


    if not new_tokens:
        return


    print()

    print(
        "🟡 NEW OPTION WATCHLIST:"
    )


    for c in candidates:

        token = str(
            c["ce_token"]
        )

        if token in new_tokens:

            print(

                c["name"],

                "ATM CE:",

                c["ce"]["symbol"],

                "TOKEN:",

                token

            )


    token_list = [

        {

            "exchangeType": 2,

            "tokens":
                new_tokens

        }

    ]


    try:

        sws.subscribe(
            "option-watch",
            3,
            token_list
        )


        for token in new_tokens:

            SUBSCRIBED_OPTION_TOKENS.add(
                token
            )


        print(
            "✅ ATM CE subscription sent:",
            len(new_tokens)
        )


    except Exception as e:

        print(
            "❌ Option subscribe error:",
            e
        )


# ============================================================
# FINAL SIGNAL CHECK
# ============================================================

def check_final_signals():

    today = now_ist().strftime(
        "%Y-%m-%d"
    )


    candidates = select_candidates()


    if not candidates:

        print(
            "⏳ No stock passed futures/market/spot filters"
        )

        return


    print(
        "🟡 Candidates:",
        len(candidates)
    )


    subscribe_options(
        candidates
    )


    for c in candidates:

        name = c["name"]

        future = c["future_live"]

        spot = c["spot_live"]

        ce = c["ce"]

        ce_token = c["ce_token"]


        option = LIVE.get(
            ce_token
        )


        if not option:
            continue


        # ========================================================
        # OPTION BUY / SELL
        # ========================================================

        buy_qty, buy_price = best_buy(
            option
        )

        sell_qty, sell_price = best_sell(
            option
        )


        if sell_qty <= 0:
            continue

        if buy_qty <= 0:
            continue


        ratio = (
            buy_qty
            / sell_qty
        )


        if ratio < OPTION_BUY_SELL_RATIO:

            print(

                f"❌ {name} CE Bid/Ask "
                f"{ratio:.2f}x < 1.8x"

            )

            continue


        # ========================================================
        # LAST 3 COMPLETED CANDLES
        # ========================================================

        candles = CANDLES.get(
            name,
            {}
        )


        completed = []


        current_minute = (
            now_ist()
            .replace(
                second=0,
                microsecond=0
            )
            .strftime(
                "%Y-%m-%d %H:%M"
            )
        )


        for key, candle in candles.items():

            if key == current_minute:
                continue

            if candle["date"] != today:
                continue

            completed.append(
                candle
            )


        completed.sort(
            key=lambda x:
            x["slot"]
        )


        completed = completed[-3:]


        if len(completed) < 3:

            print(
                f"⏳ {name}: less than 3 candles"
            )

            continue


        green_count = sum(

            1

            for x in completed

            if x["close"] > x["open"]

        )


        if green_count < MIN_GREEN_CANDLES:

            print(

                f"❌ {name}: "
                f"green candles "
                f"{green_count}/3"

            )

            continue


        # ========================================================
        # 20D VOLUME
        # ========================================================

        volume_ok = True

        volume_details = []


        for candle in completed:

            slot = candle["slot"]


            avg20 = volume_20d_average(

                name,

                slot,

                today

            )


            current_volume = max(

                0,

                candle["volume_last"]
                - candle["volume_start"]

            )


            if avg20 is None:

                volume_ok = False

                volume_details.append(

                    f"{slot}: HISTORY<20"

                )

                break


            if (
                current_volume
                > avg20 * VOLUME_MULTIPLIER
            ):

                volume_details.append(

                    f"{slot}: "
                    f"{current_volume:.0f}>"
                    f"{avg20:.0f}"

                )

            else:

                volume_ok = False

                volume_details.append(

                    f"{slot}: "
                    f"{current_volume:.0f}<="
                    f"{avg20:.0f}"

                )

                break


        if not volume_ok:

            print(
                f"❌ {name}: 20D volume failed"
            )

            continue


        # ========================================================
        # DUPLICATE SIGNAL
        # ========================================================

        signal_key = (
            name
            + "_"
            + today
        )


        if LAST_SIGNAL.get(
            signal_key
        ):

            continue


        LAST_SIGNAL[
            signal_key
        ] = True


        # ========================================================
        # FINAL ALERT
        # ========================================================

        pc = price_change(
            future
        )

        oi_pc = oi_change_percent(
            future
        )


        nifty_live = LIVE.get(
            str(
                NIFTY_FUTURE["token"]
            )
        )


        message = (

            "🟢 FINAL BUY ALERT\n\n"

            f"📌 STOCK: {name}\n"

            f"💰 SPOT: ₹"
            f"{spot['ltp']:.2f}\n\n"

            "📊 STOCK FUTURES\n"

            f"Price Change: "
            f"+{pc:.2f}%\n"

            f"OI Change: "
            f"+{oi_pc:.2f}%\n"

            f"Current OI: "
            f"{future['oi']/10000000:.2f} Cr\n"

            "Long Buildup: YES\n\n"

            "📈 MARKET\n"

            f"NIFTY FUTURE: "
            f"₹{nifty_live['ltp']:.2f}\n"

            f"NIFTY VWAP: "
            f"₹{nifty_live['vwap']:.2f}\n\n"

            "📈 STOCK\n"

            f"Spot VWAP: "
            f"₹{spot['vwap']:.2f}\n\n"

            "🟢 OPTION\n"

            f"ATM CE: "
            f"{ce['symbol']}\n"

            f"CE Bid Qty: "
            f"{buy_qty:.0f}\n"

            f"CE Ask Qty: "
            f"{sell_qty:.0f}\n"

            f"Bid/Ask Qty: "
            f"{ratio:.2f}x\n\n"

            "🕯 PRICE ACTION\n"

            f"Last 3 candles green: "
            f"{green_count}/3\n"

            "20D Volume: PASS\n\n"

            f"⏰ "
            f"{now_ist().strftime('%H:%M:%S')} IST"

        )


        print()

        print(
            "=" * 80
        )

        print(
            message
        )

        print(
            "=" * 80
        )


        send_telegram(
            message
        )


        save_signal(

            c,

            ratio,

            green_count,

            volume_details

        )


# ============================================================
# SAVE SIGNAL
# ============================================================

def save_signal(
    candidate,
    ratio,
    green_count,
    volume_details
):

    exists = os.path.exists(
        SIGNAL_FILE
    )


    with open(

        SIGNAL_FILE,

        "a",

        newline="",

        encoding="utf-8"

    ) as f:


        writer = csv.writer(
            f
        )


        if not exists:

            writer.writerow([

                "TIME",
                "STOCK",
                "FUTURE",
                "SPOT",
                "ATM_CE",
                "CE_BID_QTY",
                "CE_ASK_QTY",
                "BID_ASK_RATIO",
                "GREEN_CANDLES",
                "VOLUME_CHECK"

            ])


        option = LIVE.get(
            candidate["ce_token"]
        )


        bid_qty, _ = best_buy(
            option
        )

        ask_qty, _ = best_sell(
            option
        )


        writer.writerow([

            now_ist().strftime(
                "%Y-%m-%d %H:%M:%S"
            ),

            candidate["name"],

            candidate["future"]["symbol"],

            candidate["spot_live"]["ltp"],

            candidate["ce"]["symbol"],

            bid_qty,

            ask_qty,

            ratio,

            green_count,

            " | ".join(
                volume_details
            )

        ])


# ============================================================
# WEBSOCKET DATA
# ============================================================

def on_data(
    wsapp,
    message
):

    if not isinstance(
        message,
        dict
    ):

        return


    token = message.get(
        "token"
    )


    if not token:
        return


    process_tick(
        token,
        message
    )


# ============================================================
# WEBSOCKET OPEN
# ============================================================

def on_open(
    wsapp
):

    print()

    print(
        "🟢 WebSocket connected"
    )


    token_list = []

    nse_fo_tokens = []
    nse_cm_tokens = []


    for token, info in WATCHLIST.items():

        if info["kind"] in (
            "FUTURE",
            "NIFTY_FUTURE"
        ):

            nse_fo_tokens.append(
                token
            )


        elif info["kind"] == "SPOT":

            nse_cm_tokens.append(
                token
            )


    if nse_cm_tokens:

        token_list.append({

            "exchangeType": 1,

            "tokens":
                nse_cm_tokens

        })


    if nse_fo_tokens:

        token_list.append({

            "exchangeType": 2,

            "tokens":
                nse_fo_tokens

        })


    try:

        sws.subscribe(

            "futures-vwap-scan",

            3,

            token_list

        )


        print(
            "✅ Futures + Spot subscription sent"
        )

        print(
            "📡 Spot tokens:",
            len(nse_cm_tokens)
        )

        print(
            "📡 Futures tokens:",
            len(nse_fo_tokens)
        )


    except Exception as e:

        print(
            "❌ Subscription error:",
            e
        )


# ============================================================
# WEBSOCKET ERROR
# ============================================================

def on_error(
    wsapp,
    error
):

    print(
        "❌ WebSocket error:",
        error
    )


# ============================================================
# WEBSOCKET CLOSE
# ============================================================

def on_close(
    wsapp
):

    print(
        "🔴 WebSocket closed"
    )


# ============================================================
# STRATEGY LOOP
# ============================================================

def strategy_loop():

    last_check = 0


    while True:


        if market_time() >= END_TIME:

            print(
                "🛑 15:00 IST reached."
            )


            try:

                sws.close_connection()

            except Exception:

                pass


            break


        now_ts = time.time()


        if now_ts - last_check >= 10:

            last_check = now_ts


            try:

                save_completed_candles()

            except Exception as e:

                print(
                    "⚠️ History save error:",
                    e
                )


            print()

            print(
                "🔎 Running strategy scan:",
                now_ist().strftime(
                    "%H:%M:%S"
                )
            )


            try:

                check_final_signals()

            except Exception as e:

                print(
                    "⚠️ Strategy error:",
                    e
                )


        time.sleep(1)


