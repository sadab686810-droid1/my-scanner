name: FUTURES OI + VWAP + ATM CE BUY SCANNER

on:

  schedule:
    # 09:15 IST = 03:45 UTC
    - cron: '45 3 * * 1-5'

  workflow_dispatch:


jobs:

  scan:

    runs-on: ubuntu-latest

    timeout-minutes: 370

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      # ============================================================
      # INSTALL PACKAGES
      # ============================================================

      - name: Install Packages
        run: |

          python -m pip install --upgrade pip

          python -m pip install smartapi-python
          python -m pip install websocket-client
          python -m pip install pyotp
          python -m pip install requests
          python -m pip install logzero

          echo "=============================================="
          echo "VERIFY PACKAGES"
          echo "=============================================="

          python -m pip show logzero

          python -c "import logzero; print('✅ LOGZERO OK')"

          python -c "from SmartApi import SmartConnect; print('✅ SMARTAPI OK')"

          echo "=============================================="


      # ============================================================
      # RESTORE 20D VOLUME HISTORY
      # ============================================================

      - name: Restore Volume History
        uses: actions/cache@v4
        with:

          path: data

          key: futures-volume-history-${{ github.run_id }}

          restore-keys: |
            futures-volume-history-


      # ============================================================
      # CREATE SCANNER
      # ============================================================

      - name: Create Scanner
        env:

          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP: ${{ secrets.ANGEL_TOTP }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          mkdir -p data

          cat > scanner.py <<'PYTHON'

import os
import csv
import json
import math
import time
import threading
import requests
import pyotp

from datetime import datetime, time as dt_time, timezone
from zoneinfo import ZoneInfo

from SmartApi import SmartConnect
from SmartApi.smartWebSocketV2 import SmartWebSocketV2


# ============================================================
# TIMEZONE
# ============================================================

IST = ZoneInfo("Asia/Kolkata")


def now_ist():
    return datetime.now(IST)


def market_time():
    return now_ist().time()


# ============================================================
# CREDENTIALS
# ============================================================

API_KEY = os.getenv("ANGEL_API_KEY")
CLIENT_ID = os.getenv("ANGEL_CLIENT_ID")
PASSWORD = os.getenv("ANGEL_PASSWORD")
TOTP_SECRET = os.getenv("ANGEL_TOTP")

TELEGRAM_BOT_TOKEN = os.getenv("TELEGRAM_BOT_TOKEN")
TELEGRAM_CHAT_ID = os.getenv("TELEGRAM_CHAT_ID")


# ============================================================
# MARKET TIME
# ============================================================

START_TIME = dt_time(9, 15, 0)
END_TIME = dt_time(15, 0, 0)


# ============================================================
# CONDITIONS
# ============================================================

FUTURES_PRICE_CHANGE_MIN = 1.5
FUTURES_OI_CHANGE_MIN = 2.0
FUTURES_MIN_OI = 30_000_000

OPTION_BUY_SELL_RATIO = 1.8

MIN_GREEN_CANDLES = 2

VOLUME_MULTIPLIER = 1.0

REQUIRED_HISTORY_DAYS = 20


# ============================================================
# NIFTY
# ============================================================

NIFTY_NAME = "NIFTY"


# ============================================================
# FILES
# ============================================================

HISTORY_FILE = "data/volume_history.json"

SIGNAL_FILE = "futures_buy_signals.csv"


# ============================================================
# GLOBALS
# ============================================================

smart_api = None
sws = None

MASTER = []

FUTURES = {}
OPTIONS = {}
SPOTS = {}

NIFTY_FUTURE = None

WATCHLIST = {}
LIVE = {}
CANDLES = {}

LAST_SIGNAL = {}

SUBSCRIBED_OPTION_TOKENS = set()

LOCK = threading.Lock()


# ============================================================
# TELEGRAM
# ============================================================

def send_telegram(message):

    if not TELEGRAM_BOT_TOKEN:
        print("⚠️ TELEGRAM_BOT_TOKEN missing")
        return

    if not TELEGRAM_CHAT_ID:
        print("⚠️ TELEGRAM_CHAT_ID missing")
        return

    url = (
        "https://api.telegram.org/bot"
        + TELEGRAM_BOT_TOKEN
        + "/sendMessage"
    )

    try:

        r = requests.post(
            url,
            data={
                "chat_id": TELEGRAM_CHAT_ID,
                "text": message
            },
            timeout=10
        )

        if r.ok:
            print("📲 Telegram sent")

        else:
            print(
                "❌ Telegram error:",
                r.status_code,
                r.text
            )

    except Exception as e:

        print(
            "❌ Telegram exception:",
            e
        )


# ============================================================
# LOAD HISTORY
# ============================================================

def load_history():

    if not os.path.exists(HISTORY_FILE):
        return {}

    try:

        with open(
            HISTORY_FILE,
            "r",
            encoding="utf-8"
        ) as f:

            return json.load(f)

    except Exception:

        return {}


HISTORY = load_history()


# ============================================================
# SAVE HISTORY
# ============================================================

def save_history():

    os.makedirs(
        "data",
        exist_ok=True
    )

    with open(
        HISTORY_FILE,
        "w",
        encoding="utf-8"
    ) as f:

        json.dump(
            HISTORY,
            f,
            separators=(",", ":")
        )


# ============================================================
# DOWNLOAD SCRIP MASTER
# ============================================================

def download_master():

    url = (
        "https://margincalculator.angelone.in/"
        "OpenAPI_File/files/"
        "OpenAPIScripMaster.json"
    )

    print(
        "📥 Downloading Angel One Scrip Master..."
    )

    r = requests.get(
