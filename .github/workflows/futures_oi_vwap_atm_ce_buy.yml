          # ==========================================================

          def on_data(wsapp, message):

              try:

                  if isinstance(
                      message,
                      str
                  ):

                      try:

                          message = json.loads(
                              message
                          )

                      except Exception:

                          return


                  if not isinstance(
                      message,
                      dict
                  ):

                      return


                  process_tick(
                      message
                  )


                  token = str(
                      message.get(
                          "token",
                          ""
                      )
                  )

                  if not token:
                      return


                  # --------------------------------------------------
                  # FIND STOCK SPOT
                  # --------------------------------------------------

                  for name, spot in SPOTS.items():

                      if spot["token"] == token:

                          item = LIVE.get(
                              token
                          )

                          if item:

                              update_candle(
                                  name,
                                  item
                              )

                          break


              except Exception as e:

                  print(
                      "WebSocket data error:",
                      e
                  )


