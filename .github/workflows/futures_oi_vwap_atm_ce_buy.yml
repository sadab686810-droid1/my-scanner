name: FUTURES OI + VWAP + ATM CE BUY SCANNER

on:
  schedule:
    # 09:15 IST = 03:45 UTC
    - cron: '45 3 * * 1-5'

  workflow_dispatch:

jobs:

  scan:

    runs-on: ubuntu-latest

    timeout-minutes: 370

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. PYTHON
      # ==========================================================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'


      # ==========================================================
      # 3. INSTALL PACKAGES
      # ==========================================================
      - name: Install Packages
        run: |
          python -m pip install --upgrade pip

          pip install smartapi-python
          pip install websocket-client
          pip install pyotp
          pip install requests
          pip install logzero


      # ==========================================================
      # 4. VERIFY PACKAGES
      # ==========================================================
      - name: Verify Packages
        run: |
          python -c "import logzero; print('LOGZERO OK')"
          python -c "from SmartApi import SmartConnect; print('SMARTAPI OK')"
          python -c "from SmartApi.smartWebSocketV2 import SmartWebSocketV2; print('SMARTWEBSOCKETV2 OK')"


      # ==========================================================
      # 5. RESTORE VOLUME HISTORY
      # ==========================================================
      - name: Restore Volume History
        uses: actions/cache/restore@v4
        with:
          path: data
          key: futures-volume-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            futures-volume-history-


      # ==========================================================
      # 6. PREPARE DATA
      # ==========================================================
      - name: Prepare Data
        run: |
          mkdir -p data

          if [ ! -f data/volume_history.json ]; then
            echo '{}' > data/volume_history.json
          fi

          echo "=========================================="
          echo "DATA DIRECTORY"
          echo "=========================================="

          ls -lah data


      # ==========================================================
      # 7. CREATE SCANNER.PY
      # ==========================================================
      - name: Create Scanner
        run: |
          cat > scanner.py <<'PYTHON'

          import os
          import csv
          import json
          import time
          import threading
          from datetime import datetime
          from zoneinfo import ZoneInfo

          import requests
          import pyotp

          from SmartApi import SmartConnect
          from SmartApi.smartWebSocketV2 import SmartWebSocketV2


          # ==========================================================
          # CONFIGURATION
          # ==========================================================

          IST = ZoneInfo("Asia/Kolkata")

          MARKET_START = "09:15"
          MARKET_END = "15:00"

          MIN_PRICE_CHANGE = 1.5
          MIN_OI_CHANGE = 2.0

          MIN_CURRENT_OI = 30_000_000

          MIN_BID_ASK_RATIO = 1.8

          HISTORY_DAYS = 20

          MASTER_URL = (
              "https://margincalculator.angelone.in/"
              "OpenAPI_File/files/OpenAPIScripMaster.json"
          )

          HISTORY_FILE = "data/volume_history.json"

          SIGNAL_FILE = "futures_buy_signals.csv"


          # ==========================================================
          # SECRETS
          # ==========================================================

          ANGEL_API_KEY = os.getenv(
              "ANGEL_API_KEY",
              ""
          )

          ANGEL_CLIENT_ID = os.getenv(
              "ANGEL_CLIENT_ID",
              ""
          )

          ANGEL_PASSWORD = os.getenv(
              "ANGEL_PASSWORD",
              ""
          )

          ANGEL_TOTP = os.getenv(
              "ANGEL_TOTP",
              ""
          )

          TELEGRAM_BOT_TOKEN = os.getenv(
              "TELEGRAM_BOT_TOKEN",
              ""
          )

          TELEGRAM_CHAT_ID = os.getenv(
              "TELEGRAM_CHAT_ID",
              ""
          )


          # ==========================================================
          # GLOBAL VARIABLES
          # ==========================================================

          smart_api = None

          sws = None

          MASTER = []

          FUTURES = {}

          OPTIONS = {}

          SPOTS = {}

          NIFTY_FUTURE = None

          LIVE = {}

          CANDLES = {}

          CANDLE_ARCHIVE = {}

          HISTORY = {}

          LAST_SIGNAL = set()

          SUBSCRIBED_OPTION_TOKENS = set()

          WS_READY = False


          # ==========================================================
          # TIME
          # ==========================================================

          def now_ist():

              return datetime.now(
                  IST
              )


          def today_string():

              return now_ist().strftime(
                  "%Y-%m-%d"
              )


          def current_time_string():

              return now_ist().strftime(
                  "%H:%M:%S"
              )


          # ==========================================================
          # TELEGRAM
          # ==========================================================

          def send_telegram(message):

              if (
                  not TELEGRAM_BOT_TOKEN
                  or not TELEGRAM_CHAT_ID
              ):

                  print(
                      "Telegram credentials not configured."
                  )

                  return False

              try:

                  url = (
                      "https://api.telegram.org/bot"
                      + TELEGRAM_BOT_TOKEN
                      + "/sendMessage"
                  )

                  payload = {
                      "chat_id": TELEGRAM_CHAT_ID,
                      "text": message
                  }

                  response = requests.post(
                      url,
                      json=payload,
                      timeout=15
                  )

                  if response.status_code == 200:

                      print(
                          "Telegram sent."
                      )

                      return True

                  print(
                      "Telegram failed:",
                      response.status_code,
                      response.text
                  )

                  return False

              except Exception as e:

                  print(
                      "Telegram error:",
                      e
                  )

                  return False


          # ==========================================================
          # LOAD HISTORY
          # ==========================================================

          def load_history():

              global HISTORY

              try:

                  if os.path.exists(
                      HISTORY_FILE
                  ):

                      with open(
                          HISTORY_FILE,
                          "r",
                          encoding="utf-8"
                      ) as f:

                          HISTORY = json.load(f)

                      print(
                          "Volume history loaded:",
                          len(HISTORY),
                          "stocks"
                      )

                  else:

                      HISTORY = {}

              except Exception as e:

                  print(
                      "History load error:",
                      e
                  )

                  HISTORY = {}


          # ==========================================================
          # SAVE HISTORY
          # ==========================================================

          def save_history():

              try:

                  os.makedirs(
                      "data",
                      exist_ok=True
                  )

                  with open(
                      HISTORY_FILE,
                      "w",
                      encoding="utf-8"
                  ) as f:

                      json.dump(
                          HISTORY,
                          f,
                          indent=2
                      )

                  print(
                      "Volume history saved."
                  )

              except Exception as e:

                  print(
                      "History save error:",
                      e
                  )


          # ==========================================================
          # DOWNLOAD MASTER
          # ==========================================================

          def download_master():

              global MASTER

              print("")
              print("=" * 70)
              print("DOWNLOADING ANGEL ONE SCRIP MASTER")
              print("=" * 70)

              try:

                  response = requests.get(
                      MASTER_URL,
                      timeout=60
                  )

                  response.raise_for_status()

                  MASTER = response.json()

                  print(
                      "TOTAL SCRIP MASTER:",
                      len(MASTER)
                  )

                  return True

              except Exception as e:

                  print(
                      "Scrip master error:",
                      e
                  )

                  return False


          # ==========================================================
          # EXPIRY PARSER
          # ==========================================================

          def parse_expiry(value):

              if not value:

                  return None

              value = str(
                  value
              ).strip().upper()

              formats = [
                  "%d%b%Y",
                  "%d%b%y",
                  "%Y-%m-%d"
              ]

              for fmt in formats:

                  try:

                      return datetime.strptime(
                          value,
                          fmt
                      ).date()

                  except Exception:

                      pass

              return None


          # ==========================================================
          # BUILD CONTRACTS
          # ==========================================================

          def build_contracts():

              global FUTURES
              global OPTIONS
              global SPOTS
              global NIFTY_FUTURE

              FUTURES = {}

              OPTIONS = {}

              SPOTS = {}

              NIFTY_FUTURE = None

              today = now_ist().date()

              futures_temp = {}

              options_temp = {}

              print("")
              print("=" * 70)
              print("BUILDING CONTRACT LIST")
              print("=" * 70)


              # ======================================================
              # READ MASTER
              # ======================================================

              for row in MASTER:

                  try:

                      exch = str(
                          row.get(
                              "exch_seg",
                              ""
                          )
                      ).lower()

                      symbol = str(
                          row.get(
                              "symbol",
                              ""
                          )
                      ).upper()

                      name = str(
                          row.get(
                              "name",
                              ""
                          )
                      ).upper()

                      token = str(
                          row.get(
                              "token",
                              ""
                          )
                      )

                      expiry = parse_expiry(
                          row.get(
                              "expiry",
                              ""
                          )
                      )


                      # =================================================
                      # NSE EQUITY
                      # =================================================

                      if exch in (
                          "nse",
                          "nse_cm"
                      ):

                          if symbol.endswith(
                              "-EQ"
                          ):

                              base_name = symbol[:-3]

                              SPOTS[
                                  base_name
                              ] = {

                                  "token": token,

                                  "symbol": symbol,

                                  "name": base_name
                              }


                      # =================================================
                      # ONLY NFO BELOW
                      # =================================================

                      if exch != "nfo":

                          continue


                      if expiry is None:

                          continue


                      if expiry < today:

                          continue


                      instrument = str(
                          row.get(
                              "instrumenttype",
                              ""
                          )
                      ).upper()


                      # =================================================
                      # STOCK FUTURES
                      # =================================================

                      if instrument == "FUTSTK":

                          if name not in futures_temp:

                              futures_temp[
                                  name
                              ] = []


                          futures_temp[
                              name
                          ].append({

                              "token": token,

                              "symbol": symbol,

                              "name": name,

                              "expiry": expiry
                          })


                      # =================================================
                      # NIFTY FUTURE
                      # =================================================

                      elif instrument == "FUTIDX":

                          if name == "NIFTY":

                              if NIFTY_FUTURE is None:

                                  NIFTY_FUTURE = {

                                      "token": token,

                                      "symbol": symbol,

                                      "name": name,

                                      "expiry": expiry
                                  }

                              elif (
                                  expiry
                                  <
                                  NIFTY_FUTURE[
                                      "expiry"
                                  ]
                              ):

                                  NIFTY_FUTURE = {

                                      "token": token,

                                      "symbol": symbol,

                                      "name": name,

                                      "expiry": expiry
                                  }


                      # =================================================
                      # STOCK CE OPTIONS
                      # =================================================

                      elif instrument == "OPTSTK":

                          option_type = str(
                              row.get(
                                  "optiontype",
                                  ""
                              )
                          ).upper()


                          if option_type != "CE":

                              continue


                          strike_raw = row.get(
                              "strike",
                              0
                          )


                          try:

                              strike = (
                                  float(
                                      strike_raw
                                  ) / 100
                              )

                          except Exception:

                              continue


                          if name not in options_temp:

                              options_temp[
                                  name
                              ] = []


                          options_temp[
                              name
                          ].append({

                              "token": token,

                              "symbol": symbol,

                              "name": name,

                              "expiry": expiry,

                              "strike": strike,

                              "option_type": "CE"
                          })


                  except Exception as e:

                      print(
                          "Contract parsing error:",
                          e
                      )

                      continue


              # ======================================================
              # SELECT NEAREST STOCK FUTURE
              # ======================================================

              for name, rows in futures_temp.items():

                  rows = sorted(
                      rows,
                      key=lambda x: x["expiry"]
                  )

                  if rows:

                      FUTURES[
                          name
                      ] = rows[0]


              # ======================================================
              # STORE OPTION CHAINS
              # ======================================================

              for name, rows in options_temp.items():

                  rows = sorted(
                      rows,
                      key=lambda x: (
                          x["expiry"],
                          x["strike"]
                      )
                  )

                  OPTIONS[
                      name
                  ] = rows


              # ======================================================
              # SUMMARY
              # ======================================================

              print(
                  "NSE SPOT STOCKS:",
                  len(SPOTS)
              )

              print(
                  "STOCK FUTURES:",
                  len(FUTURES)
              )

              print(
                  "STOCK OPTION CHAINS:",
                  len(OPTIONS)
              )


              if NIFTY_FUTURE:

                  print(
                      "NIFTY FUTURE:",
                      NIFTY_FUTURE["symbol"],
                      NIFTY_FUTURE["expiry"]
                  )

              else:

                  print(
                      "NIFTY FUTURE NOT FOUND"
                  )


          # ==========================================================
          # FIND ATM CE
          # ==========================================================

          def find_atm_ce(
              name,
              spot_price
          ):

              rows = OPTIONS.get(
                  name,
                  []
              )

              if not rows:

                  return None


              nearest_expiry = min(
                  row["expiry"]
                  for row in rows
              )


              same_expiry = [

                  row

                  for row in rows

                  if row["expiry"]
                  ==
                  nearest_expiry
              ]


              if not same_expiry:

                  return None


              atm = min(

                  same_expiry,

                  key=lambda row:
                  abs(
                      row["strike"]
                      -
                      spot_price
                  )
              )


              return atm


          # ==========================================================
          # PRICE CHANGE
          # ==========================================================

          def price_change(item):

              ltp = item.get(
                  "ltp"
              )

              close = item.get(
                  "close"
              )

              if (
                  ltp is None
                  or close is None
                  or close <= 0
              ):

                  return None


              return (
                  (ltp - close)
                  /
                  close
                  *
                  100
              )


          # ==========================================================
          # OI CHANGE
          # ==========================================================

          def oi_change_percent(item):

              value = item.get(
                  "oi_change_percent"
              )


              if value is not None:

                  try:

                      return float(
                          value
                      )

                  except Exception:

                      pass


              opening_oi = item.get(
                  "opening_oi"
              )

              current_oi = item.get(
                  "oi"
              )


              if (
                  opening_oi is None
                  or current_oi is None
                  or opening_oi <= 0
              ):

                  return None


              return (
                  (
                      current_oi
                      -
                      opening_oi
                  )
                  /
                  opening_oi
                  *
                  100
              )


          # ==========================================================
          # BEST BID
          # ==========================================================

          def best_buy(item):

              levels = item.get(
                  "best_5_buy_data",
                  []
              )


              if not levels:

                  return 0, 0


              try:

                  qty = float(
                      levels[0].get(
                          "quantity",
                          0
                      )
                  )

                  price = (
                      float(
                          levels[0].get(
                              "price",
                              0
                          )
                      )
                      /
                      100
                  )

                  return qty, price

              except Exception:

                  return 0, 0


          # ==========================================================
          # BEST ASK
          # ==========================================================

          def best_sell(item):

              levels = item.get(
                  "best_5_sell_data",
                  []
              )


              if not levels:

                  return 0, 0


              try:

                  qty = float(
                      levels[0].get(
                          "quantity",
                          0
                      )
                  )

                  price = (
                      float(
                          levels[0].get(
                              "price",
                              0
                          )
                      )
                      /
                      100
                  )

                  return qty, price

              except Exception:

                  return 0, 0


          # ==========================================================
          # PROCESS WEBSOCKET TICK
          # ==========================================================

          def process_tick(message):

              try:

                  if isinstance(
                      message,
                      str
                  ):

                      try:

                          message = json.loads(
                              message
                          )

                      except Exception:

                          return


                  if not isinstance(
                      message,
                      dict
                  ):

                      return


                  token = str(
                      message.get(
                          "token",
                          ""
                      )
                  )


                  if not token:

                      return


                  ltp_raw = message.get(
                      "last_traded_price"
                  )


                  if ltp_raw is None:

                      return


                  ltp = (
                      float(
                          ltp_raw
                      )
                      /
                      100
                  )


                  volume_raw = message.get(
                      "volume_trade_for_the_day"
                  )


                  volume = None


                  if volume_raw is not None:

                      try:

                          volume = float(
                              volume_raw
                          )

                      except Exception:

                          volume = None


                  oi_raw = message.get(
                      "open_interest"
                  )


                  oi = None


                  if oi_raw is not None:

                      try:

                          oi = float(
                              oi_raw
                          )

                      except Exception:

                          oi = None


                  close_raw = message.get(
                      "closed_price"
                  )


                  close = None


                  if close_raw is not None:

                      try:

                          close = (
                              float(
                                  close_raw
                              )
                              /
                              100
                          )

                      except Exception:

                          close = None


                  avg_raw = message.get(
                      "average_traded_price"
                  )


                  average_price = None


                  if avg_raw is not None:

                      try:

                          average_price = (
                              float(
                                  avg_raw
                              )
                              /
                              100
                          )

                      except Exception:

                          average_price = None


                  oi_change_raw = message.get(
                      "open_interest_change_percentage"
                  )


                  oi_change = None


                  if oi_change_raw is not None:

                      try:

                          oi_change = float(
                              oi_change_raw
                          )

                      except Exception:

                          oi_change = None


                  timestamp = (
                      message.get(
                          "exchange_timestamp"
                      )
                      or
                      message.get(
                          "last_traded_timestamp"
                      )
                  )


                  tick_time = now_ist()


                  if timestamp is not None:

                      try:

                          ts = float(
                              timestamp
                          )


                          if ts > 10_000_000_000:

                              ts = ts / 1000


                          tick_time = datetime.fromtimestamp(
                              ts,
                              tz=IST
                          )

                      except Exception:

                          pass


                  previous = LIVE.get(
                      token
                  )


                  opening_oi = None


                  if previous:

                      opening_oi = previous.get(
                          "opening_oi"
                      )


                  if (
                      opening_oi is None
                      and oi is not None
                  ):

                      opening_oi = oi


                  LIVE[token] = {

                      "token": token,

                      "ltp": ltp,

                      "volume": volume,

                      "oi": oi,

                      "opening_oi": opening_oi,

                      "close": close,

                      "average_price":
                          average_price,

                      "oi_change_percent":
                          oi_change,

                      "timestamp": tick_time,

                      "best_5_buy_data":
                          message.get(
                              "best_5_buy_data",
                              []
                          ),

                      "best_5_sell_data":
                          message.get(
                              "best_5_sell_data",
                              []
                          )
                  }


              except Exception as e:

                  print(
                      "Tick parse error:",
                      e
                  )


          # ==========================================================
          # ARCHIVE COMPLETED CANDLE
          # ==========================================================

          def archive_completed_candle(
              name,
              candle
          ):

              try:

                  minute_key = candle.get(
                      "minute"
                  )


                  if not minute_key:

                      return


                  volume_start = candle.get(
                      "volume_start"
                  )

                  volume_last = candle.get(
                      "volume_last"
                  )


                  if (
                      volume_start is None
                      or volume_last is None
                  ):

                      return


                  volume = max(
                      0,
                      volume_last
                      -
                      volume_start
                  )


                  slot = minute_key[11:16]


                  record = {

                      "minute": minute_key,

                      "slot": slot,

                      "open": float(
                          candle["open"]
                      ),

                      "high": float(
                          candle["high"]
                      ),

                      "low": float(
                          candle["low"]
                      ),

                      "close": float(
                          candle["close"]
                      ),

                      "volume": float(
                          volume
                      )
                  }


                  CANDLE_ARCHIVE.setdefault(
                      name,
                      []
                  )


                  CANDLE_ARCHIVE[
                      name
                  ].append(
                      record
                  )


                  CANDLE_ARCHIVE[
                      name
                  ] = (
                      CANDLE_ARCHIVE[
                          name
                      ][-100:]
                  )


                  # ==================================================
                  # 20-DAY VOLUME HISTORY
                  # ==================================================

                  HISTORY.setdefault(
                      name,
                      {}
                  )


                  HISTORY[
                      name
                  ].setdefault(
                      slot,
                      {}
                  )


                  HISTORY[
                      name
                  ][
                      slot
                  ][
                      today_string()
                  ] = volume


                  dates = sorted(
                      HISTORY[
                          name
                      ][
                          slot
                      ].keys()
                  )


                  if len(dates) > 25:

                      old_dates = dates[:-25]

                      for old_date in old_dates:

                          del HISTORY[
                              name
                          ][
                              slot
                          ][
                              old_date
                          ]


              except Exception as e:

                  print(
                      "Archive candle error:",
                      name,
                      e
                  )


          # ==========================================================
          # UPDATE CANDLE
          # ==========================================================

          def update_candle(
              name,
              item
          ):

              ltp = item.get(
                  "ltp"
              )


              if ltp is None:

                  return


              timestamp = item.get(
                  "timestamp"
              )


              if timestamp is None:

                  timestamp = now_ist()


              minute = timestamp.replace(
                  second=0,
                  microsecond=0
              )


              minute_key = minute.strftime(
                  "%Y-%m-%d %H:%M"
              )


              volume_day = item.get(
                  "volume"
              )


              state = CANDLES.get(
                  name
              )


              # ======================================================
              # FIRST CANDLE
              # ======================================================

              if state is None:

                  CANDLES[
                      name
                  ] = {

                      "minute": minute_key,

                      "open": float(ltp),

                      "high": float(ltp),

                      "low": float(ltp),

                      "close": float(ltp),

                      "volume_start":
                          volume_day,

                      "volume_last":
                          volume_day
                  }

                  return


              # ======================================================
              # NEW MINUTE
              # ======================================================

              if state[
                  "minute"
              ] != minute_key:

                  archive_completed_candle(
                      name,
                      state
                  )


                  CANDLES[
                      name
                  ] = {

                      "minute": minute_key,

                      "open": float(ltp),

                      "high": float(ltp),

                      "low": float(ltp),

                      "close": float(ltp),

                      "volume_start":
                          volume_day,

                      "volume_last":
                          volume_day
                  }

                  return


              # ======================================================
              # SAME MINUTE
              # ======================================================

              state["high"] = max(
                  state["high"],
                  float(ltp)
              )


              state["low"] = min(
                  state["low"],
                  float(ltp)
              )


              state["close"] = float(
                  ltp
              )


              if volume_day is not None:

                  state[
                      "volume_last"
                  ] = volume_day


          # ==========================================================
          # SAVE COMPLETED CANDLES
          # ==========================================================

          def save_completed_candles():

              current_minute = (
                  now_ist()
                  .replace(
                      second=0,
                      microsecond=0
                  )
                  .strftime(
                      "%Y-%m-%d %H:%M"
                  )
              )


              for name, candle in list(
                  CANDLES.items()
              ):

                  try:

                      if (
                          candle.get(
                              "minute"
                          )
                          !=
                          current_minute
                      ):

                          archive_completed_candle(
                              name,
                              candle
                          )

                          CANDLES.pop(
                              name,
                              None
                          )

                  except Exception as e:

                      print(
                          "Candle save error:",
                          name,
                          e
                      )


          # ==========================================================
          # 20 DAY SAME-SLOT AVERAGE
          # ==========================================================

          def volume_20d_average(
              name,
              slot,
              today
          ):

              stock_data = HISTORY.get(
                  name,
                  {}
              )


              slot_data = stock_data.get(
                  slot,
                  {}
              )


              dates = [

                  d

                  for d in slot_data.keys()

                  if d != today

              ]


              dates.sort(
                  reverse=True
              )


              dates = dates[
                  :HISTORY_DAYS
              ]


              if len(dates) < HISTORY_DAYS:

                  return None


              values = []


              for d in dates:

                  try:

                      values.append(
                          float(
                              slot_data[d]
                          )
                      )

                  except Exception:

                      pass


              if len(values) < HISTORY_DAYS:

                  return None


              return (
                  sum(values)
                  /
                  len(values)
              )


          # ==========================================================
