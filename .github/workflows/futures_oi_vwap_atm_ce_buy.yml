# ============================================================
# EXPIRY PARSER
# ============================================================

def expiry_value(value):

    if not value:
        return None

    try:

        return datetime.strptime(
            str(value),
            "%d%b%Y"
        ).date()

    except Exception:

        try:

            return datetime.strptime(
                str(value),
                "%Y-%m-%d"
            ).date()

        except Exception:

            return None


# ============================================================
# STRIKE
# ============================================================

def strike_value(value):

    try:
        return float(value)

    except Exception:
        return 0.0


# ============================================================
# BUILD CONTRACT MAP
# ============================================================

def build_contracts():

    global FUTURES
    global OPTIONS
    global SPOTS
    global NIFTY_FUTURE

    today = now_ist().date()

    FUTURES = {}
    OPTIONS = {}
    SPOTS = {}
    NIFTY_FUTURE = None

    for row in MASTER:

        exch = str(
            row.get(
                "exch_seg",
                ""
            )
        ).lower()

        symbol = str(
            row.get(
                "symbol",
                ""
            )
        )

        name = str(
            row.get(
                "name",
                ""
            )
        )

        token = str(
            row.get(
                "token",
                ""
            )
        )

        instrument = str(
            row.get(
                "instrumenttype",
                ""
            )
        )

        expiry = expiry_value(
            row.get("expiry")
        )


        # ========================================================
        # NSE EQUITY
        # ========================================================

        if (
            exch in ("nse", "nse_cm")
            and symbol.endswith("-EQ")
        ):

            SPOTS[name] = {
                "token": token,
                "symbol": symbol
            }


        # ========================================================
        # STOCK FUTURES
        # ========================================================

        if (
            exch == "nfo"
            and instrument == "FUTSTK"
            and expiry
            and expiry >= today
        ):

            FUTURES.setdefault(
                name,
                []
            ).append({

                "token": token,
                "symbol": symbol,
                "expiry": expiry,
                "lotsize": row.get(
                    "lotsize",
                    ""
                )

            })


        # ========================================================
        # NIFTY FUTURE
        # ========================================================

        if (
            exch == "nfo"
            and instrument == "FUTIDX"
            and name.upper() == NIFTY_NAME
            and expiry
            and expiry >= today
        ):

            if NIFTY_FUTURE is None:

                NIFTY_FUTURE = {
                    "token": token,
                    "symbol": symbol,
                    "expiry": expiry
                }

            elif expiry < NIFTY_FUTURE["expiry"]:

                NIFTY_FUTURE = {
                    "token": token,
                    "symbol": symbol,
                    "expiry": expiry
                }


        # ========================================================
        # STOCK OPTIONS
        # ========================================================

        if (
            exch == "nfo"
            and instrument == "OPTSTK"
            and expiry
            and expiry >= today
        ):

            upper_symbol = symbol.upper()

            if upper_symbol.endswith("CE"):
                option_type = "CE"

            elif upper_symbol.endswith("PE"):
                option_type = "PE"

            else:
                option_type = ""

            if option_type:

                OPTIONS.setdefault(
                    name,
                    []
                ).append({

                    "token": token,
                    "symbol": symbol,
                    "expiry": expiry,

                    "strike":
                        strike_value(
                            row.get("strike")
                        ) / 100,

                    "type":
                        option_type

                })


    # ========================================================
    # NEAREST FUTURE
    # ========================================================

    for name in list(FUTURES.keys()):

        contracts = FUTURES[name]

        contracts.sort(
            key=lambda x: x["expiry"]
        )

        FUTURES[name] = contracts[:1]


    # ========================================================
    # OPTIONS SORT
    # ========================================================

    for name in list(OPTIONS.keys()):

        OPTIONS[name].sort(
            key=lambda x: (
                x["expiry"],
                x["strike"]
            )
        )


    print()
    print(
        "📊 Spot symbols:",
        len(SPOTS)
    )

    print(
        "📊 Futures symbols:",
        len(FUTURES)
    )

    print(
        "📊 Options symbols:",
        len(OPTIONS)
    )


    if NIFTY_FUTURE:

        print(
            "📌 NIFTY FUTURE:",
            NIFTY_FUTURE["symbol"],
            NIFTY_FUTURE["token"]
        )

    else:

        print(
            "❌ NIFTY FUTURE NOT FOUND"
        )


# ============================================================
# FIND ATM CE
# ============================================================

def find_atm_ce(
    name,
    spot_price
):

    contracts = OPTIONS.get(
        name,
        []
    )

    if not contracts:
        return None

    today = now_ist().date()

    valid = [

        x

        for x in contracts

        if (
            x["expiry"] >= today
            and
            x["type"] == "CE"
        )

    ]

    if not valid:
        return None

    nearest_expiry = min(
        x["expiry"]
        for x in valid
    )

    valid = [

        x

        for x in valid

        if x["expiry"] == nearest_expiry

    ]

    return min(

        valid,

        key=lambda x:
        abs(
            x["strike"]
            - spot_price
        )

    )


# ============================================================
# FUTURES PRICE CHANGE
# ============================================================

def price_change(item):

    ltp = item.get(
        "ltp",
        0
    )

    close = item.get(
        "close",
        0
    )

    if close <= 0:
        return None

    return (
        (ltp - close)
        / close
    ) * 100


# ============================================================
# OI CHANGE
# ============================================================

def oi_change_percent(item):

    current_oi = item.get(
        "oi",
        0
    )

    api_change = item.get(
        "oi_change_percent",
        None
    )

    if (
        api_change is not None
        and math.isfinite(api_change)
        and abs(api_change) < 1000
    ):

        return api_change


    opening_oi = item.get(
        "opening_oi"
    )

    if (
        opening_oi
        and opening_oi > 0
    ):

        return (
            (current_oi - opening_oi)
            / opening_oi
        ) * 100

    return None


