name: FUTURES OI + VWAP + ATM CE BUY SCANNER

on:
  schedule:
    # 09:15 IST = 03:45 UTC
    - cron: '45 3 * * 1-5'

  workflow_dispatch:

jobs:

  scan:

    runs-on: ubuntu-latest

    timeout-minutes: 370

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. SETUP PYTHON
      # ==========================================================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'


      # ==========================================================
      # 3. INSTALL PACKAGES
      # ==========================================================
      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip

          pip install smartapi-python
          pip install websocket-client
          pip install pyotp
          pip install requests
          pip install logzero


      # ==========================================================
      # 4. VERIFY PACKAGES
      # ==========================================================
      - name: Verify Python Packages
        run: |

          python -c "import logzero; print('LOGZERO OK')"

          python -c "from SmartApi import SmartConnect; print('SMARTAPI OK')"

          python -c "from SmartApi.smartWebSocketV2 import SmartWebSocketV2; print('SMARTWEBSOCKETV2 OK')"


      # ==========================================================
      # 5. RESTORE 20-DAY VOLUME HISTORY
      # ==========================================================
      - name: Restore Volume History
        uses: actions/cache/restore@v4
        with:
          path: data
          key: futures-volume-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            futures-volume-history-


      # ==========================================================
      # 6. PREPARE DATA FOLDER
      # ==========================================================
      - name: Prepare Data Folder
        run: |
          mkdir -p data

          if [ ! -f data/volume_history.json ]; then
            echo '{}' > data/volume_history.json
          fi

          echo "=========================================="
          echo "DATA FOLDER"
          echo "=========================================="

          ls -lah data


      # ==========================================================
      # 7. CREATE SCANNER.PY
      # ==========================================================
      - name: Create Scanner
        run: |
          cat > scanner.py <<'PYTHON'

          import os
          import csv
          import json
          import time
          import threading
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          import requests
          import pyotp

          from SmartApi import SmartConnect
          from SmartApi.smartWebSocketV2 import SmartWebSocketV2


          # ==========================================================
          # CONFIG
          # ==========================================================

          IST = ZoneInfo("Asia/Kolkata")

          MARKET_START = "09:15"
          MARKET_END = "15:00"

          MIN_PRICE_CHANGE = 1.5
          MIN_OI_CHANGE = 2.0

          MIN_CURRENT_OI = 30_000_000

          MIN_BID_ASK_RATIO = 1.8

          HISTORY_DAYS = 20

          HISTORY_FILE = "data/volume_history.json"

          SIGNAL_FILE = "futures_buy_signals.csv"

          MASTER_URL = (
              "https://margincalculator.angelone.in/"
              "OpenAPI_File/files/OpenAPIScripMaster.json"
          )


          # ==========================================================
          # ANGEL ONE CREDENTIALS
          # ==========================================================

          ANGEL_API_KEY = os.getenv("ANGEL_API_KEY", "")
          ANGEL_CLIENT_ID = os.getenv("ANGEL_CLIENT_ID", "")
          ANGEL_PASSWORD = os.getenv("ANGEL_PASSWORD", "")
          ANGEL_TOTP = os.getenv("ANGEL_TOTP", "")

          TELEGRAM_BOT_TOKEN = os.getenv("TELEGRAM_BOT_TOKEN", "")
          TELEGRAM_CHAT_ID = os.getenv("TELEGRAM_CHAT_ID", "")


          # ==========================================================
          # GLOBALS
          # ==========================================================

          smart_api = None
          sws = None

          MASTER = []

          FUTURES = {}
          OPTIONS = {}
          SPOTS = {}

          NIFTY_FUTURE = None

          WATCHLIST = []

          LIVE = {}

          CANDLES = {}

          HISTORY = {}

          LAST_SIGNAL = {}

          SUBSCRIBED_OPTION_TOKENS = set()

          WS_READY = False

          LOCK = threading.Lock()


          # ==========================================================
          # TIME HELPERS
          # ==========================================================

          def now_ist():
              return datetime.now(IST)


          def today_string():
              return now_ist().strftime("%Y-%m-%d")


          def current_time_string():
              return now_ist().strftime("%H:%M:%S")


          def market_time_ok():

              t = now_ist().strftime("%H:%M")

              return MARKET_START <= t <= MARKET_END


          # ==========================================================
          # TELEGRAM
          # ==========================================================

          def send_telegram(message):

              if not TELEGRAM_BOT_TOKEN or not TELEGRAM_CHAT_ID:
                  print("Telegram credentials not configured.")
                  return False

              try:

                  url = (
                      "https://api.telegram.org/bot"
                      f"{TELEGRAM_BOT_TOKEN}/sendMessage"
                  )

                  payload = {
                      "chat_id": TELEGRAM_CHAT_ID,
                      "text": message
                  }

                  response = requests.post(
                      url,
                      json=payload,
                      timeout=15
                  )

                  if response.status_code == 200:
                      print("Telegram sent.")
                      return True

                  print(
                      "Telegram failed:",
                      response.status_code,
                      response.text
                  )

                  return False

              except Exception as e:

                  print("Telegram error:", e)

                  return False


          # ==========================================================
          # LOAD VOLUME HISTORY
          # ==========================================================

          def load_history():

              global HISTORY

              try:

                  if os.path.exists(HISTORY_FILE):

                      with open(
                          HISTORY_FILE,
                          "r",
                          encoding="utf-8"
                      ) as f:

                          HISTORY = json.load(f)

                      print(
                          "Volume history loaded:",
                          len(HISTORY),
                          "stocks"
                      )

                  else:

                      HISTORY = {}

              except Exception as e:

                  print("History load error:", e)

                  HISTORY = {}


          # ==========================================================
          # SAVE VOLUME HISTORY
          # ==========================================================

          def save_history():

              try:

                  os.makedirs(
                      os.path.dirname(HISTORY_FILE),
                      exist_ok=True
                  )

                  with open(
                      HISTORY_FILE,
                      "w",
                      encoding="utf-8"
                  ) as f:

                      json.dump(
                          HISTORY,
                          f,
                          indent=2
                      )

                  print("Volume history saved.")

              except Exception as e:

                  print("History save error:", e)


          # ==========================================================
          # DOWNLOAD SCRIP MASTER
          # ==========================================================

          def download_master():

              global MASTER

              print("")
              print("=" * 70)
              print("DOWNLOADING ANGEL ONE SCRIP MASTER")
              print("=" * 70)

              try:

                  response = requests.get(
                      MASTER_URL,
                      timeout=60
                  )

                  response.raise_for_status()

                  MASTER = response.json()

                  print(
                      "TOTAL SCRIP MASTER:",
                      len(MASTER)
                  )

                  return True

              except Exception as e:

                  print(
                      "Scrip master error:",
                      e
                  )

                  return False


          # ==========================================================
          # DATE PARSER
          # ==========================================================

          def parse_expiry(value):

              if not value:
                  return None

              value = str(value).strip()

              formats = [
                  "%d%b%Y",
                  "%d%b%y",
                  "%Y-%m-%d"
              ]

              for fmt in formats:

                  try:

                      return datetime.strptime(
                          value.upper(),
                          fmt
                      ).date()

                  except Exception:
                      pass

              return None


          # ==========================================================
          # BUILD CONTRACTS
          # ==========================================================

          def build_contracts():

              global FUTURES
              global OPTIONS
              global SPOTS
              global NIFTY_FUTURE

              FUTURES = {}
              OPTIONS = {}
              SPOTS = {}
              NIFTY_FUTURE = None

              today = now_ist().date()

              futures_temp = {}
              options_temp = {}

              print("")
              print("=" * 70)
              print("BUILDING CONTRACT LIST")
              print("=" * 70)

              for row in MASTER:

                  try:

                      exch = str(
                          row.get("exch_seg", "")
                      ).lower()

                      symbol = str(
                          row.get("symbol", "")
                      ).upper()

                      name = str(
                          row.get("name", "")
                      ).upper()

                      token = str(
                          row.get("token", "")
                      )

                      expiry = parse_expiry(
                          row.get("expiry", "")
                      )

                      if exch in ("nse", "nse_cm"):

                          if symbol.endswith("-EQ"):

                              base_name = symbol[:-3]

                              SPOTS[base_name] = {
                                  "token": token,
                                  "symbol": symbol,
                                  "name": base_name
                              }


                      if exch != "nfo":
                          continue

                      instrument = str(
                          row.get("instrumenttype", "")
                      ).upper()

                      if expiry is None:
                          continue

                      if expiry < today:
                          continue


                      # ------------------------------------------------
                      # STOCK FUTURES
                      # ------------------------------------------------

                      if instrument == "FUTSTK":

                          if name not in futures_temp:

                              futures_temp[name] = []

                          futures_temp[name].append({
                              "token": token,
                              "symbol": symbol,
                              "name": name,
                              "expiry": expiry
                          })


                      # ------------------------------------------------
                      # NIFTY FUTURES
                      # ------------------------------------------------

                      elif instrument == "FUTIDX":

                          if name == "NIFTY":

                              if NIFTY_FUTURE is None:

                                  NIFTY_FUTURE = {
                                      "token": token,
                                      "symbol": symbol,
                                      "name": name,
                                      "expiry": expiry
                                  }

                              else:

                                  if expiry < NIFTY_FUTURE["expiry"]:

                                      NIFTY_FUTURE = {
                                          "token": token,
                                          "symbol": symbol,
                                          "name": name,
                                          "expiry": expiry
                                      }


                      # ------------------------------------------------
                      # STOCK CE OPTIONS
                      # ------------------------------------------------

                      elif instrument == "OPTSTK":

                          option_type = str(
                              row.get("optiontype", "")
                          ).upper()

                          if option_type != "CE":
                              continue

                          strike_raw = row.get(
                              "strike",
                              0
                          )

                          try:

                              strike = (
                                  float(strike_raw) / 100
                              )

                          except Exception:

                              continue

                          if name not in options_temp:

                              options_temp[name] = []

                          options_temp[name].append({
                              "token": token,
                              "symbol": symbol,
                              "name": name,
                              "expiry": expiry,
                              "strike": strike,
                              "option_type": "CE"
                          })


              # ========================================================
              # SELECT NEAREST STOCK FUTURE
              # ========================================================

              for name, rows in futures_temp.items():

                  rows = sorted(
                      rows,
                      key=lambda x: x["expiry"]
                  )

                  if rows:

                      FUTURES[name] = rows[0]


              # ========================================================
              # STORE OPTIONS
              # ========================================================

              for name, rows in options_temp.items():

                  rows = sorted(
                      rows,
                      key=lambda x: (
                          x["expiry"],
                          x["strike"]
                      )
                  )

                  OPTIONS[name] = rows


              print(
                  "NSE SPOT STOCKS:",
                  len(SPOTS)
              )

              print(
                  "STOCK FUTURES:",
                  len(FUTURES)
              )

              print(
                  "STOCK OPTION CHAINS:",
                  len(OPTIONS)
              )

              if NIFTY_FUTURE:

                  print(
                      "NIFTY FUTURE:",
                      NIFTY_FUTURE["symbol"],
                      NIFTY_FUTURE["expiry"]
                  )

              else:

                  print("NIFTY FUTURE NOT FOUND")


          # ==========================================================
          # FIND ATM CE
          # ==========================================================

          def find_atm_ce(
              name,
              spot_price
          ):

              rows = OPTIONS.get(
                  name,
                  []
              )

              if not rows:
                  return None

              nearest_expiry = min(
                  row["expiry"]
                  for row in rows
              )

              same_expiry = [
                  row
                  for row in rows
                  if row["expiry"] == nearest_expiry
              ]

              if not same_expiry:
                  return None

              atm = min(
                  same_expiry,
                  key=lambda row:
                  abs(
                      row["strike"] -
                      spot_price
                  )
              )

              return atm


          # ==========================================================
          # PRICE CHANGE
          # ==========================================================

          def price_change(item):

              ltp = item.get(
                  "ltp"
              )

              close = item.get(
                  "close"
              )

              if ltp is None or close is None:
                  return None

              if close <= 0:
                  return None

              return (
                  (ltp - close)
                  / close
                  * 100
              )


          # ==========================================================
          # OI CHANGE
          # ==========================================================

          def oi_change_percent(item):

              value = item.get(
                  "oi_change_percent"
              )

              if value is not None:

                  try:

                      return float(value)

                  except Exception:
                      pass


              opening_oi = item.get(
                  "opening_oi"
              )

              oi = item.get(
                  "oi"
              )

              if (
                  opening_oi is None
                  or oi is None
                  or opening_oi <= 0
              ):

                  return None

              return (
                  (oi - opening_oi)
                  / opening_oi
                  * 100
              )


          # ==========================================================
          # BEST BUY
          # ==========================================================

          def best_buy(item):

              levels = item.get(
                  "best_5_buy_data",
                  []
              )

              if not levels:
                  return 0, 0

              try:

                  qty = float(
                      levels[0].get(
                          "quantity",
                          0
                      )
                  )

                  price = float(
                      levels[0].get(
                          "price",
                          0
                      )
                  ) / 100

                  return qty, price

              except Exception:

                  return 0, 0


          # ==========================================================
          # BEST SELL
          # ==========================================================

          def best_sell(item):

              levels = item.get(
                  "best_5_sell_data",
                  []
              )

              if not levels:
                  return 0, 0

              try:

                  qty = float(
                      levels[0].get(
                          "quantity",
                          0
                      )
                  )

                  price = float(
                      levels[0].get(
                          "price",
                          0
                      )
                  ) / 100

                  return qty, price

              except Exception:

                  return 0, 0


          # ==========================================================
          # PARSE WEBSOCKET TICK
          # ==========================================================

          def process_tick(message):

              try:

                  token = str(
                      message.get(
                          "token",
                          ""
                      )
                  )

                  if not token:
                      return

                  ltp_raw = message.get(
                      "last_traded_price"
                  )

                  if ltp_raw is None:
                      return

                  ltp = float(
                      ltp_raw
                  ) / 100

                  volume_raw = message.get(
                      "volume_trade_for_the_day"
                  )

                  volume = (
                      float(volume_raw)
                      if volume_raw is not None
                      else None
                  )

                  oi_raw = message.get(
                      "open_interest"
                  )

                  oi = (
                      float(oi_raw)
                      if oi_raw is not None
                      else None
                  )

                  close_raw = message.get(
                      "closed_price"
                  )

                  close = (
                      float(close_raw) / 100
                      if close_raw is not None
                      else None
                  )

                  avg_raw = message.get(
                      "average_traded_price"
                  )

                  average_price = (
                      float(avg_raw) / 100
                      if avg_raw is not None
                      else None
                  )

                  oi_change_raw = message.get(
                      "open_interest_change_percentage"
                  )

                  oi_change = None

                  if oi_change_raw is not None:

                      try:

                          oi_change = float(
                              oi_change_raw
                          )

                      except Exception:

                          oi_change = None


                  timestamp = (
                      message.get(
                          "exchange_timestamp"
                      )
                      or
                      message.get(
                          "last_traded_timestamp"
                      )
                  )

                  tick_time = now_ist()

                  if timestamp is not None:

                      try:

                          ts = float(timestamp)

                          if ts > 10_000_000_000:

                              ts /= 1000

                          tick_time = datetime.fromtimestamp(
                              ts,
                              tz=IST
                          )

                      except Exception:
                          pass


                  LIVE[token] = {

                      "token": token,

                      "ltp": ltp,

                      "volume": volume,

                      "oi": oi,

                      "close": close,

                      "average_price": average_price,

                      "oi_change_percent": oi_change,

                      "timestamp": tick_time,

                      "best_5_buy_data":
                          message.get(
                              "best_5_buy_data",
                              []
                          ),

                      "best_5_sell_data":
                          message.get(
                              "best_5_sell_data",
                              []
                          )
                  }


              except Exception as e:

                  print(
                      "Tick parse error:",
                      e
                  )


          # ==========================================================
          # CANDLE UPDATE
          # ==========================================================

          def update_candle(
              name,
              item
          ):

              if item.get("ltp") is None:
                  return

              timestamp = item.get(
                  "timestamp"
              )

              if timestamp is None:
                  timestamp = now_ist()

              minute = timestamp.replace(
                  second=0,
                  microsecond=0
              )

              minute_key = minute.strftime(
                  "%Y-%m-%d %H:%M"
              )

              ltp = float(
                  item["ltp"]
              )

              volume_day = item.get(
                  "volume"
              )

              state = CANDLES.get(
                  name
              )

              if state is None:

                  CANDLES[name] = {
                      "minute": minute_key,
                      "open": ltp,
                      "high": ltp,
                      "low": ltp,
                      "close": ltp,
                      "volume_start":
                          volume_day,
                      "volume_last":
                          volume_day
                  }

                  return


              if state["minute"] != minute_key:

                  save_completed_candle(
                      name,
                      state
                  )

                  CANDLES[name] = {
                      "minute": minute_key,
                      "open": ltp,
                      "high": ltp,
                      "low": ltp,
                      "close": ltp,
                      "volume_start":
                          volume_day,
                      "volume_last":
                          volume_day
                  }

                  return


              state["high"] = max(
                  state["high"],
                  ltp
              )

              state["low"] = min(
                  state["low"],
                  ltp
              )

              state["close"] = ltp

              if volume_day is not None:

                  state["volume_last"] = volume_day


          # ==========================================================
          # SAVE COMPLETED CANDLE
          # ==========================================================

          def save_completed_candle(
              name,
              candle
          ):

              try:

                  minute_key = candle.get(
                      "minute"
                  )

                  if not minute_key:
                      return

                  date_part = minute_key[:10]

                  time_part = minute_key[11:16]

                  volume_start = candle.get(
                      "volume_start"
                  )

                  volume_last = candle.get(
                      "volume_last"
                  )

                  if (
                      volume_start is None
                      or volume_last is None
                  ):

                      return

                  volume = max(
                      0,
                      volume_last -
                      volume_start
                  )

                  HISTORY.setdefault(
                      name,
                      {}
                  )

                  HISTORY[name].setdefault(
                      time_part,
                      {}
                  )

                  HISTORY[name][time_part][
                      date_part
                  ] = volume

                  # Keep latest 25 sessions
                  dates = sorted(
                      HISTORY[name][time_part].keys()
                  )

                  if len(dates) > 25:

                      for old_date in dates[:-25]:

                          del HISTORY[name][time_part][
                              old_date
                          ]

              except Exception as e:

                  print(
                      "Save candle error:",
                      name,
                      e
                  )


          # ==========================================================
          # SAVE ALL COMPLETED CANDLES
          # ==========================================================

          def save_completed_candles():

              for name, candle in list(
                  CANDLES.items()
              ):

                  try:

                      current_minute = (
                          now_ist()
                          .replace(
                              second=0,
                              microsecond=0
                          )
                          .strftime(
                              "%Y-%m-%d %H:%M"
                          )
                      )

                      if candle.get(
                          "minute"
                      ) != current_minute:

                          save_completed_candle(
                              name,
                              candle
                          )

                          CANDLES.pop(
                              name,
                              None
                          )

                  except Exception as e:

                      print(
                          "Candle save error:",
                          name,
                          e
                      )


          # ==========================================================
          # 20 DAY SAME SLOT AVERAGE
          # ==========================================================

          def volume_20d_average(
              name,
              slot,
              today
          ):

              stock_data = HISTORY.get(
                  name,
                  {}
              )

              slot_data = stock_data.get(
                  slot,
                  {}
              )

              dates = [
                  d
                  for d in slot_data.keys()
                  if d != today
              ]

              dates.sort(
                  reverse=True
              )

              dates = dates[:HISTORY_DAYS]

              if len(dates) < HISTORY_DAYS:

                  return None

              values = []

              for d in dates:

                  try:

                      values.append(
                          float(
                              slot_data[d]
                          )
                      )

                  except Exception:
                      pass

              if len(values) < HISTORY_DAYS:

                  return None

              return sum(values) / len(values)


          # ==========================================================
          # BUILD WATCHLIST
          # ==========================================================

          def build_watchlist():

              global WATCHLIST

              WATCHLIST = []

              if NIFTY_FUTURE:

                  WATCHLIST.append({
                      "exchangeType": 2,
                      "tokens": [
                          NIFTY_FUTURE["token"]
                      ]
                  })


              futures_tokens = []

              spot_tokens = []

              for name, future in FUTURES.items():

                  futures_tokens.append(
                      future["token"]
                  )

                  spot = SPOTS.get(
                      name
                  )

                  if spot:

                      spot_tokens.append(
                          spot["token"]
                      )


              if futures_tokens:

                  WATCHLIST.append({
                      "exchangeType": 2,
                      "tokens": futures_tokens
                  })


              if spot_tokens:

                  WATCHLIST.append({
                      "exchangeType": 1,
                      "tokens": spot_tokens
                  })


              print("")
              print(
                  "FUTURE TOKENS:",
                  len(futures_tokens)
              )

              print(
                  "SPOT TOKENS:",
                  len(spot_tokens)
              )


          # ==========================================================
          # TOKEN TO NAME
          # ==========================================================

          def token_to_name():

              mapping = {}

              if NIFTY_FUTURE:

                  mapping[
                      NIFTY_FUTURE["token"]
                  ] = "NIFTY_FUTURE"


              for name, item in FUTURES.items():

                  mapping[
                      item["token"]
                  ] = name + "_FUTURE"


              for name, item in SPOTS.items():

                  mapping[
                      item["token"]
                  ] = name + "_SPOT"


              return mapping


          # ==========================================================
          # BUILD CANDIDATES
          # ==========================================================

          def select_candidates():

              candidates = []

              if not NIFTY_FUTURE:
                  return candidates

              nifty_token = NIFTY_FUTURE[
                  "token"
              ]

              nifty_live = LIVE.get(
                  nifty_token
              )

              if not nifty_live:
                  return candidates

              nifty_ltp = nifty_live.get(
                  "ltp"
              )

              nifty_avg = nifty_live.get(
                  "average_price"
              )

              if (
                  nifty_ltp is None
                  or nifty_avg is None
                  or nifty_avg <= 0
              ):

                  return candidates


              # ------------------------------------------------------
              # MARKET CONDITION
              # NIFTY FUTURE > VWAP
              # ------------------------------------------------------

              if nifty_ltp <= nifty_avg:

                  return candidates


              for name, future in FUTURES.items():

                  future_token = future[
                      "token"
                  ]

                  spot = SPOTS.get(
                      name
                  )

                  if not spot:
                      continue

                  spot_token = spot[
                      "token"
                  ]

                  future_live = LIVE.get(
                      future_token
                  )

                  spot_live = LIVE.get(
                      spot_token
                  )

                  if (
                      not future_live
                      or not spot_live
                  ):

                      continue


                  # ==================================================
                  # FUTURES PRICE CHANGE
                  # ==================================================

                  pc = price_change(
                      future_live
                  )

                  if pc is None:
                      continue

                  if pc <= MIN_PRICE_CHANGE:
                      continue


                  # ==================================================
                  # FUTURES OI CHANGE
                  # ==================================================

                  oi_pc = oi_change_percent(
                      future_live
                  )

                  if oi_pc is None:
                      continue

                  if oi_pc <= MIN_OI_CHANGE:
                      continue


                  # ==================================================
                  # CURRENT OI > 3 CRORE
                  # ==================================================

                  current_oi = future_live.get(
                      "oi"
                  )

                  if current_oi is None:
                      continue

                  if current_oi <= MIN_CURRENT_OI:
                      continue


                  # ==================================================
                  # LONG BUILDUP
                  # ==================================================

                  if pc <= 0 or oi_pc <= 0:
                      continue


                  # ==================================================
                  # STOCK SPOT > VWAP
                  # ==================================================

                  spot_ltp = spot_live.get(
                      "ltp"
                  )

                  spot_avg = spot_live.get(
                      "average_price"
                  )

                  if (
                      spot_ltp is None
                      or spot_avg is None
                      or spot_avg <= 0
                  ):

                      continue

                  if spot_ltp <= spot_avg:
                      continue


                  # ==================================================
                  # ATM CE
                  # ==================================================

                  atm_ce = find_atm_ce(
                      name,
                      spot_ltp
                  )

                  if atm_ce is None:
                      continue


                  candidates.append({

                      "name": name,

                      "future_token":
                          future_token,

                      "spot_token":
                          spot_token,

                      "future_symbol":
                          future["symbol"],

                      "future_ltp":
                          future_live["ltp"],

                      "price_change":
                          pc,

                      "oi_change":
                          oi_pc,

                      "current_oi":
                          current_oi,

                      "spot_ltp":
                          spot_ltp,

                      "spot_vwap":
                          spot_avg,

                      "atm_ce":
                          atm_ce

                  })


              return candidates


          # ==========================================================
          # SUBSCRIBE ATM OPTIONS
          # ==========================================================

          def subscribe_options(
              candidates
          ):

              global SUBSCRIBED_OPTION_TOKENS

              if sws is None:
                  return

              new_tokens = []

              for candidate in candidates:

                  option = candidate[
                      "atm_ce"
                  ]

                  token = option[
                      "token"
                  ]

                  if token not in SUBSCRIBED_OPTION_TOKENS:

                      new_tokens.append(
                          token
                      )

                      SUBSCRIBED_OPTION_TOKENS.add(
                          token
                      )


              if not new_tokens:
                  return


              print("")
              print(
                  "SUBSCRIBING ATM CE:",
                  len(new_tokens)
              )


              try:

                  sws.subscribe(
                      "atm-ce-buy-scanner",
                      3,
                      [{
                          "exchangeType": 2,
                          "tokens": new_tokens
                      }]
                  )

                  print(
                      "ATM CE subscription successful."
                  )

              except Exception as e:

                  print(
                      "ATM CE subscription error:",
                      e
                  )


          # ==========================================================
          # CHECK FINAL SIGNALS
          # ==========================================================

          def check_final_signals():

              candidates = select_candidates()

              if not candidates:
                  return


              subscribe_options(
                  candidates
              )


              today = today_string()

              for candidate in candidates:

                  name = candidate[
                      "name"
                  ]

                  option = candidate[
                      "atm_ce"
                  ]

                  option_token = option[
                      "token"
                  ]

                  option_live = LIVE.get(
                      option_token
                  )

                  if not option_live:

                      continue


                  # ==================================================
                  # OPTION BEST BID / ASK
                  # ==================================================

                  bid_qty, bid_price = best_buy(
                      option_live
                  )

                  ask_qty, ask_price = best_sell(
                      option_live
                  )

                  if ask_qty <= 0:
                      continue

                  if bid_qty <= 0:
                      continue


                  ratio = (
                      bid_qty / ask_qty
                  )


                  # BID >= 1.8 X ASK
                  if ratio < MIN_BID_ASK_RATIO:

                      continue


                  # ==================================================
                  # LAST 3 COMPLETED CANDLES
                  # ==================================================

                  candle_list = get_last_3_completed_candles(
                      name
                  )

                  if len(candle_list) < 3:

                      continue


                  # ==================================================
                  # AT LEAST 2 GREEN
                  # ==================================================

                  green_count = 0

                  for candle in candle_list:

                      if candle["close"] > candle["open"]:

                          green_count += 1


                  if green_count < 2:

                      continue


                  # ==================================================
                  # EVERY CANDLE VOLUME > 20D AVERAGE
                  # ==================================================

                  volume_condition = True

                  for candle in candle_list:

                      slot = candle["slot"]

                      candle_volume = candle[
                          "volume"
                      ]

                      average_20d = volume_20d_average(
                          name,
                          slot,
                          today
                      )

                      if average_20d is None:

                          volume_condition = False

                          break


                      if candle_volume <= average_20d:

                          volume_condition = False

                          break


                  if not volume_condition:

                      continue


                  # ==================================================
                  # DUPLICATE SIGNAL PROTECTION
                  # ==================================================

                  signal_key = (
                      today,
                      name
                  )

                  if signal_key in LAST_SIGNAL:

                      continue


                  # ==================================================
                  # GET NIFTY LIVE
                  # ==================================================

                  nifty_live = LIVE.get(
                      NIFTY_FUTURE["token"]
                  )

                  if not nifty_live:

                      continue


                  # ==================================================
                  # FINAL BUY SIGNAL
                  # ==================================================

                  LAST_SIGNAL[
                      signal_key
                  ] = True


                  message = (
                      "🟢 FINAL BUY ALERT\n"
                      "\n"
                      f"STOCK: {name}\n"
                      f"FUTURE: {candidate['future_symbol']}\n"
                      f"FUTURE LTP: "
                      f"{candidate['future_ltp']:.2f}\n"
                      f"PRICE CHANGE: "
                      f"{candidate['price_change']:.2f}%\n"
                      f"OI CHANGE: "
                      f"{candidate['oi_change']:.2f}%\n"
                      f"CURRENT OI: "
                      f"{candidate['current_oi']:.0f}\n"
                      "\n"
                      f"SPOT LTP: "
                      f"{candidate['spot_ltp']:.2f}\n"
                      f"SPOT VWAP: "
                      f"{candidate['spot_vwap']:.2f}\n"
                      "\n"
                      f"ATM CE: "
                      f"{option['symbol']}\n"
                      f"STRIKE: "
                      f"{option['strike']:.2f}\n"
                      f"CE BID QTY: "
                      f"{bid_qty:.0f}\n"
                      f"CE ASK QTY: "
                      f"{ask_qty:.0f}\n"
                      f"BID/ASK: "
                      f"{ratio:.2f}x\n"
                      "\n"
                      f"3 CANDLES GREEN: "
                      f"{green_count}/3\n"
                      f"VOLUME: "
                      f"3/3 ABOVE 20D AVG\n"
                      "\n"
                      f"NIFTY FUTURE > VWAP: YES\n"
                      "\n"
                      f"TIME: "
                      f"{current_time_string()}"
                  )


                  print("")
                  print("=" * 70)
                  print(message)
                  print("=" * 70)


                  save_signal(
                      candidate,
                      option,
                      bid_qty,
                      ask_qty,
                      ratio,
                      green_count
                  )


                  send_telegram(
                      message
                  )


          # ==========================================================
          # GET LAST 3 COMPLETED CANDLES
          # ==========================================================

          def get_last_3_completed_candles(
              name
          ):

              candles = []

              stock_state = HISTORY.get(
                  name,
                  {}
              )

              if not stock_state:
                  return candles


              today = today_string()

              for slot, date_data in stock_state.items():

                  if today not in date_data:
                      continue

                  try:

                      volume = float(
                          date_data[today]
                      )

                  except Exception:

                      continue


                  # Candle OHLC is not stored in history,
                  # therefore use current in-memory completed
                  # candles when available.

              # ------------------------------------------------------
              # Build from in-memory candle archive
              # ------------------------------------------------------

              archive = CANDLE_ARCHIVE.get(
                  name,
                  []
              )

              if len(archive) < 3:

                  return []


              return archive[-3:]


          # ==========================================================
          # CANDLE ARCHIVE
          # ==========================================================

          CANDLE_ARCHIVE = {}


          # ==========================================================
          # SAVE COMPLETED CANDLE WITH OHLC
          # ==========================================================

          def archive_completed_candle(
              name,
              candle
          ):

              try:

                  minute_key = candle.get(
                      "minute"
                  )

                  if not minute_key:
                      return


                  volume_start = candle.get(
                      "volume_start"
                  )

                  volume_last = candle.get(
                      "volume_last"
                  )

                  if (
                      volume_start is None
                      or volume_last is None
                  ):

                      return


                  volume = max(
                      0,
                      volume_last -
                      volume_start
                  )


                  slot = minute_key[11:16]


                  record = {

                      "minute": minute_key,

                      "slot": slot,

                      "open": float(
                          candle["open"]
                      ),

                      "high": float(
                          candle["high"]
                      ),

                      "low": float(
                          candle["low"]
                      ),

                      "close": float(
                          candle["close"]
                      ),

                      "volume": float(
                          volume
                      )
                  }


                  CANDLE_ARCHIVE.setdefault(
                      name,
                      []
                  )

                  CANDLE_ARCHIVE[name].append(
                      record
                  )


                  # Keep latest 100 candles
                  CANDLE_ARCHIVE[name] = (
                      CANDLE_ARCHIVE[name][-100:]
                  )


              except Exception as e:

                  print(
                      "Archive candle error:",
                      name,
                      e
                  )


          # ==========================================================
          # PATCH CANDLE SAVE
          # ==========================================================

          original_save_completed_candle = (
              save_completed_candle
          )


          def save_completed_candle(
              name,
              candle
          ):

              archive_completed_candle(
                  name,
                  candle
              )

              original_save_completed_candle(
                  name,
                  candle
              )


