                              "strike",
                              "bid_qty",
                              "ask_qty",
                              "bid_ask_ratio",
                              "green_candles",
                              "volume_condition"
                          ])


                      writer.writerow([

                          today_string(),

                          current_time_string(),

                          candidate["name"],

                          candidate["future_symbol"],

                          candidate["future_ltp"],

                          candidate["price_change"],

