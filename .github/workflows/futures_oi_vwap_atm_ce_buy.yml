          path: futures_buy_signals.csv
          if-no-files-found: ignore


      # ==========================================================
      # 11. UPLOAD VOLUME HISTORY
      # ==========================================================
      - name: Upload Volume History
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futures-volume-history-${{ github.run_id }}
          path: data/volume_history.json
          if-no-files-found: ignore


      # ==========================================================
      # 12. SAVE CACHE
      # ==========================================================
      - name: Save Volume History Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: futures-volume-history-${{ github.run_id }}-${{ github.run_attempt }}
