                              "token"
                          ]
                      ]
                  })


              # ======================================================
              # STOCK FUTURES
              # ======================================================

              future_tokens = []


              for name, future in FUTURES.items():

                  future_tokens.append(
                      future["token"]
                  )


              if future_tokens:

                  watchlist.append({

                      "exchangeType": 2,

                      "tokens": future_tokens
                  })


              # ======================================================
              # STOCK SPOTS
              # ======================================================

              spot_tokens = []


              for name, spot in SPOTS.items():

                  if name in FUTURES:

                      spot_tokens.append(
                          spot["token"]
                      )


              if spot_tokens:

                  watchlist.append({

                      "exchangeType": 1,

                      "tokens": spot_tokens
                  })


              print("")
              print(
                  "FUTURE TOKENS:",
                  len(future_tokens)
              )

              print(
                  "SPOT TOKENS:",
                  len(spot_tokens)
              )


              return watchlist


          # ==========================================================
          # SELECT CANDIDATES
          # ==========================================================

          def select_candidates():

              candidates = []


              if NIFTY_FUTURE is None:

                  return candidates


              nifty_token = NIFTY_FUTURE[
                  "token"
              ]


              nifty_live = LIVE.get(
                  nifty_token
              )


              if nifty_live is None:

                  return candidates


              nifty_ltp = nifty_live.get(
                  "ltp"
              )


              nifty_vwap = nifty_live.get(
                  "average_price"
              )


              # ======================================================
              # MARKET: NIFTY FUTURE > VWAP
              # ======================================================

              if (
                  nifty_ltp is None
                  or nifty_vwap is None
                  or nifty_vwap <= 0
              ):

                  return candidates


              if nifty_ltp <= nifty_vwap:

                  return candidates


              # ======================================================
              # STOCK CONDITIONS
              # ======================================================

              for name, future in FUTURES.items():

                  future_token = future[
                      "token"
                  ]


                  spot = SPOTS.get(
                      name
                  )


                  if spot is None:

                      continue


                  spot_token = spot[
                      "token"
                  ]


                  future_live = LIVE.get(
                      future_token
                  )


                  spot_live = LIVE.get(
                      spot_token
                  )


                  if (
                      future_live is None
                      or spot_live is None
                  ):

                      continue


                  # ==================================================
                  # FUTURE PRICE CHANGE
                  # ==================================================

                  pc = price_change(
                      future_live
                  )


                  if pc is None:

                      continue


                  if pc <= MIN_PRICE_CHANGE:

                      continue


                  # ==================================================
                  # FUTURE OI CHANGE
                  # ==================================================

                  oi_pc = oi_change_percent(
                      future_live
                  )


                  if oi_pc is None:

                      continue


                  if oi_pc <= MIN_OI_CHANGE:

                      continue


                  # ==================================================
                  # CURRENT OI > 3 CRORE
                  # ==================================================

                  current_oi = future_live.get(
                      "oi"
                  )


                  if current_oi is None:

                      continue


                  if current_oi <= MIN_CURRENT_OI:

                      continue


                  # ==================================================
                  # LONG BUILDUP
                  # ==================================================

                  if (
                      pc <= 0
                      or oi_pc <= 0
                  ):

                      continue


                  # ==================================================
                  # SPOT > VWAP
                  # ==================================================

                  spot_ltp = spot_live.get(
                      "ltp"
                  )


                  spot_vwap = spot_live.get(
                      "average_price"
                  )


                  if (
                      spot_ltp is None
                      or spot_vwap is None
                      or spot_vwap <= 0
                  ):

                      continue


                  if spot_ltp <= spot_vwap:

                      continue


                  # ==================================================
                  # ATM CE
                  # ==================================================

                  atm_ce = find_atm_ce(
                      name,
                      spot_ltp
                  )


                  if atm_ce is None:

                      continue


                  candidates.append({

                      "name": name,

                      "future_token":
                          future_token,

                      "spot_token":
                          spot_token,

                      "future_symbol":
                          future["symbol"],

                      "future_ltp":
                          future_live["ltp"],

                      "price_change":
                          pc,

                      "oi_change":
                          oi_pc,

                      "current_oi":
                          current_oi,

                      "spot_ltp":
                          spot_ltp,

                      "spot_vwap":
                          spot_vwap,

                      "atm_ce":
                          atm_ce
                  })


              return candidates


